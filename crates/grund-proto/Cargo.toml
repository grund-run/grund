[package]
name = "grund-proto"
description = "grund's API contract: the protobuf services under proto/, compiled at build time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
client = ["connectrpc/client"]

[dependencies]
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
connectrpc-build = "=0.9.0"
