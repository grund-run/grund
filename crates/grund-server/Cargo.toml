[package]
name = "grund-server"
description = "grund's control plane: the dashboard, the API and the background work behind them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
anyhow.workspace = true
async-nats.workspace = true
axum.workspace = true
base64.workspace = true
bytes = "1"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
chrono.workspace = true
clap.workspace = true
connectrpc = { version = "=0.9.1", features = ["axum"] }
ed25519-dalek = "2"
futures-util.workspace = true
getrandom.workspace = true
grund-domain.workspace = true
grund-entry.workspace = true
grund-net.workspace = true
grund-password.workspace = true
grund-proto.workspace = true
grund-store.workspace = true
grund-tls.workspace = true
hex.workspace = true
hmac.workspace = true
http = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
iroh = "=1.2.0"
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring", "time", "x509-parser"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
libc = "0.2"
mire.workspace = true
mire-sagas.workspace = true
minijinja = { version = "2.24", features = ["json"] }
nostatus.workspace = true
notmad.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { workspace = true, features = ["io"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true
webpki-roots = "1"
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
argon2 = "0.5"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
grund-proto = { workspace = true, features = ["client"] }
http-body-util = "0.1"
