[package]
name = "grund-server"
description = "grund's control plane: the dashboard, the API and the background work behind them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
async-nats.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
ed25519-dalek = "2"
futures-util.workspace = true
getrandom.workspace = true
grund-domain.workspace = true
grund-store.workspace = true
hex.workspace = true
hmac.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
mire.workspace = true
minijinja = { version = "2.24", features = ["json"] }
nostatus.workspace = true
notmad.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util = "0.1"
