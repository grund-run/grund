[package]
name = "grund-agent"
description = "grund's machine agent: what runs on every machine grund manages, starting with registering it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes = "1"
buffa = { version = "=0.9.2", features = ["json"] }
chrono.workspace = true
clap.workspace = true
ed25519-dalek = "2"
getrandom.workspace = true
grund-domain.workspace = true
grund-entry.workspace = true
grund-net.workspace = true
grund-proto.workspace = true
grund-tls.workspace = true
hex.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
iroh = "=1.2.0"
libc = "0.2"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_urlencoded = "0.7"
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower-service = "0.3"
tracing.workspace = true
toml = "1"
webpki-roots = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
# The resolved tests serve a fake resolve1 over a socket pair, with no bus.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
