[package]
name = "grund-cli"
description = "grund's client CLI: everything the dashboard does, over the Connect API, describing itself as JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[[bin]]
name = "grund"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
buffa = { version = "=0.9.2", features = ["json"] }
buffa-descriptor = "=0.9.2"
clap.workspace = true
chrono.workspace = true
grund-config.workspace = true
grund-descriptors.workspace = true
grund-crypto.workspace = true
indicatif = { version = "0.18", default-features = false }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustix = { version = "1.1", features = ["fs", "pipe"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-std", "io-util", "process", "fs"] }
uuid.workspace = true
webpki-roots = "1"

