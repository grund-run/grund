[package]
name = "grund-cli"
description = "grund's client CLI: everything the dashboard does, over the Connect API, describing itself as JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[dependencies]
anyhow.workspace = true
base64.workspace = true
buffa = { version = "=0.9.2", features = ["json"] }
buffa-descriptor = "=0.9.2"
clap.workspace = true
grund-domain.workspace = true
grund-proto.workspace = true
grund-tls.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
