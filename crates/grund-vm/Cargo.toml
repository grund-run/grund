[package]
name = "grund-vm"
description = "Firecracker microVMs on a machine grund manages: what grund agent runs when an organisation asks for a machine on its own hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[dependencies]
anyhow.workspace = true
grund-agent.workspace = true
hex.workspace = true
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
