[package]
name = "grund-password"
description = "grund's password hashing: Argon2id with grund's parameters, hash and verify. Its own crate, where the Argon2 code is instantiated, so its compile settings can be set apart from the rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
# OsRng, for the salt.
password-hash = { version = "0.5", features = ["getrandom"] }
