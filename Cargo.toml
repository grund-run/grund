[workspace]
resolver = "3"
members = ["crates/*", "ee/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://git.kjuulh.io/grund/grund"
# Licenses are per crate (see LICENSE): AGPL-3.0-only for the core,
# Apache-2.0 for the API contract, the grund Commercial License for ee/.

[workspace.dependencies]
grund-agent = { path = "crates/grund-agent" }
grund-cli = { path = "crates/grund-cli" }
grund-vm = { path = "crates/grund-vm" }
grund-net = { path = "crates/grund-net" }
grund-password = { path = "crates/grund-password" }
grund-domain = { path = "crates/grund-domain" }
grund-entry = { path = "crates/grund-entry" }
grund-ee = { path = "ee/grund-ee" }
grund-proto = { path = "crates/grund-proto" }
grund-server = { path = "crates/grund-server" }
grund-store = { path = "crates/grund-store" }
grund-tls = { path = "crates/grund-tls" }
grund-containers = { path = "crates/grund-containers" }

anyhow = "1"
async-nats = "0.50"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
hmac = "0.12"
mire = "=0.3.1"
mire-sagas = "=0.3.1"
nostatus = { version = "=0.1.1", default-features = false }
notmad = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "limit", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }

# Thin LTO at opt-level 3 (Kasper, 2026-10-02). Fat LTO at opt-level "z"
# made grund 43 % smaller (36.8 -> 20.8 MB), but on dev a sign-in's server
# work went from ~16-17 ms to ~31-32 ms, and compiling password hashing at
# 3 in its own crate (grund-password) did not win it back on dev (~32 ms),
# although an isolated Argon2 benchmark said it should. grund-docs
# docs/ci-performance.md.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Password hashing is the slow step of every sign-in; unoptimised it costs
# seconds, which makes debug builds and their tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
