# Seed the tag's arm64 dependency cache without paying a final binary LTO.
# Separate workspace from ci.yaml; only the atomic snapshot crosses workflows.
# Workspace outputs are pruned, so ordinary source pushes need no reseed.
# Manual main runs can fill an evicted/cold cache without a dependency change.
when:
  - event: push
    branch: ci/ciperf-release
    path:
      include:
        - Cargo.lock
        - rust-toolchain.toml
        - .woodpecker/release-cache.yaml
        - tools/release-build.sh
  - event: manual
    branch: ci/ciperf-release

labels:
  platform: linux/amd64
concurrency: 1

steps:
  arm64-libraries:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_TARGET: aarch64-unknown-linux-musl
      CARGO_TARGET_DIR: target/release-arm64
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      SCCACHE_CACHE_SIZE: 2G
    commands:
      - apk add --no-cache musl-dev binutils protobuf-dev sccache ca-certificates curl python3 xz git
      - &arm-cache-client 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'
      - 'if command -v ci-cache >/dev/null; then ci-cache restore release-arm64 --preset cargo --dir scratch/tag-release/tooling; eval "$$(ci-cache env)"; fi'
      - sh tools/release-build.sh cache-arm64
      - test ! -e scratch/tag-release/dist
      - CARGO_LOG=cargo::core::compiler::fingerprint=info CI_PIPELINE_EVENT=manual sh tools/release-build.sh cache-arm64
      - test ! -e scratch/tag-release/dist
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'

  cache-save:
    image: alpine:3.24.0
    depends_on: [arm64-libraries]
    failure: ignore
    environment:
      CICACHE_SAVE: always
      CICACHE_PASSWORD:
        from_secret: ci_cache_public
    commands:
      - *arm-cache-client
      - 'if command -v ci-cache >/dev/null; then ci-cache save-all --refresh; fi'
