# Real arm64 cache trial; no tag, package, image or release publisher.
when:
  - event: push
    branch: ci/ciperf-arm-cache

labels:
  platform: linux/amd64

steps:
  arm-cache:
    image: rust:1.98.1-alpine3.24
    environment:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_TARGET: aarch64-unknown-linux-musl
      CARGO_TARGET_DIR: target/release-arm64
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
    commands:
      - apk add --no-cache musl-dev binutils protobuf-dev sccache ca-certificates curl python3 xz qemu-aarch64 git
      - &arm-cache-bootstrap 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'
      - python3 tools/release-measure.py arm-cache

  cache-save:
    image: alpine:3.24.0
    depends_on: [arm-cache]
    failure: ignore
    environment:
      CICACHE_SAVE: always
      CICACHE_PASSWORD:
        from_secret: ci_cache_public
    commands:
      - *arm-cache-bootstrap
      - du -sk target/release-arm64 target/release-arm64/.ci-cache-sccache scratch/tag-release/tooling
      - ci-cache save-all --refresh
