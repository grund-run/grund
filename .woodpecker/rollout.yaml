# Generated by kjuulh/woodpecker-forest. Re-run `forest run install` after changing component config.
# Required Woodpecker secrets:
#   forest_token - Forest API token for FOREST_SERVER

when:
  - event: push
    branch: main
  - event: manual

depends_on:
  - images

labels:
  platform: linux/amd64

steps:
  release-dev:
    image: git.kjuulh.io/kjuulh/woodpecker-forest:0.1.1
    when:
      - event: push
        branch: main
      - event: manual
    environment:
      FOREST_TOKEN:
        from_secret: forest_token
    settings:
      forest_server: https://api.forest.kjuulh.io
      cue_registry: "forest.sh=registry.forest.i.kjuulh.io,registry.cuelang.org"
      artifact_image: git.kjuulh.io/grund/grund
      image_tag_prefix: main
      tag_set_key: kjuulh/kubernetes-app.tag
      source_type: woodpecker
      description_prefix: "Branch"
