# Tag creation is the explicit release approval. Alpha tags create prereleases;
# installers select them from the release list, not releases/latest.
when:
  - event: tag
    ref: refs/tags/v*

# Reuse ci.yaml's lint, proto, workspace tests and real-binary contract gates.
# Workspaces are separate: this workflow builds the version-attributed files.
depends_on: [ci]
concurrency: 1
labels:
  platform: linux/amd64

services:
  release-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund_release
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund-release-disposable
      POSTGRES_INITDB_ARGS: "-c fsync=off -c synchronous_commit=off -c full_page_writes=off"
  release-nats:
    image: nats:2.15-alpine

steps:
  linux-binaries:
    image: rust:1.98.1-alpine3.24
    environment:
      CARGO_BUILD_JOBS: "4"
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 40G
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
    commands:
      - apk add --no-cache musl-dev binutils protobuf-dev sccache ca-certificates curl python3 xz qemu-aarch64 git
      # Zig supplies the arm64 musl C toolchain; user-mode QEMU runs the result
      # without privileged binfmt setup or pretending an ELF inspection ran it.
      - sh tools/release-build.sh

  released-binary-runtime:
    image: alpine:3.24.0
    depends_on: [linux-binaries]
    environment:
      GRUND_RELEASE_DATABASE_URL: postgres://grund:grund-release-disposable@release-postgres:5432/grund_release
      GRUND_RELEASE_NATS_URL: nats://release-nats:4222
    commands:
      - apk add --no-cache python3 curl openssl
      # Exercise final download bytes, not the differently attributed ci build.
      # Readiness must prove this commit and both real dependencies; the same
      # binary then creates an owner, probes HTTP and makes a real CLI RPC.
      - python3 tools/release-runtime.py scratch/tag-release/dist/grund-linux-amd64

  image-amd64:
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    depends_on: [released-binary-runtime]
    settings:
      dockerfile: Dockerfile.prebuilt
      context: scratch/tag-release/image-amd64
      repo: git.kjuulh.io/grund/grund
      platforms: linux/amd64
      tags: ${CI_COMMIT_TAG}-amd64
      auto_tag: false
      default_labels: false
      provenance: false
      build_args:
        SOURCE_DATE_EPOCH: "0"
      dry_run: true
      output: type=oci,dest=scratch/tag-release/image-amd64.tar

  image-arm64:
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    depends_on: [released-binary-runtime]
    settings:
      # Only COPYs the already-executed static arm64 binary; no RUN or emulation.
      dockerfile: Dockerfile.prebuilt
      context: scratch/tag-release/image-arm64
      repo: git.kjuulh.io/grund/grund
      platforms: linux/arm64
      tags: ${CI_COMMIT_TAG}-arm64
      auto_tag: false
      default_labels: false
      provenance: false
      build_args:
        SOURCE_DATE_EPOCH: "0"
      dry_run: true
      output: type=oci,dest=scratch/tag-release/image-arm64.tar

  publish-verified-release:
    image: alpine:3.24.0
    depends_on: [image-amd64, image-arm64]
    environment:
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - apk add --no-cache python3 skopeo git ca-certificates
      # Archive inspection compares the packaged /grund with each verified
      # download before any side effect. Existing registry tags must match.
      - python3 tools/release.py merge-images
      - python3 tools/release.py publish-image
      # Payloads, then SHA256SUMS, then public byte verification, then the Gitea
      # release. No mutable latest package, image, or download is ever written.
      - python3 tools/release.py publish
