# Every gate, and the image, in one workflow, so the steps share one
# workspace and run side by side:
#
#   lint ──────────────┐
#   proto ─────────────┤
#   test ────┐         ├─ image-publish (push to main) / image-dry-run (PR)
#   release ─┴ contract┤
#   release ─ guest-image ─ artifacts-publish (push to main)
#
# `test` runs the unit tests and the accepttests against a binary cargo
# spawns; `release` builds the static binary that ships; `contract` runs the
# accepttest binary `test` already compiled against that staged release
# binary, so the artifact that ships is the one the accepttests assert
# against, and the accepttests are compiled once. The image is published only
# when every gate passed.
#
# Required Woodpecker secret (push to main only; pull requests use none):
#   registry_token: a git.kjuulh.io token for user kjuulh with package write
#   access to the grund organisation. Currently the instance-wide secret, the
#   same one grund/website uses.
#
# Beside the image, the static binary and a microVM guest image, as the Gitea
# generic package grund/generic/grund/main-<sha>/ (grund, grund-guest.ext4,
# and a .sha256 of each), with the same secret: what a device's `grund agent`
# runs, and the rootfs RunVm names by URL and SHA-256 (grund-docs
# design/vm-runtime.md).
#
# One immutable tag, main-${CI_COMMIT_SHA}. kjuulh/woodpecker-forest computes
# exactly that tag from the commit and pins the release to it, so a rollout
# cannot find its image if this tag stops being published. There is no latest
# or main tag: a moving tag gives a rollback nothing to roll back to.

# A push or pull request that changes only documentation (*.md)
# runs nothing: no build reads those files. Woodpecker then also drops
# rollout.yaml, which depends on this workflow, so no release is staged for
# an image that was not built (checked on grund/fleet branch ci/pathtest,
# 2026-09-26). The next change to anything else tests the whole tree.
when:
  - event: push
    branch: main
    path:
      exclude: ["*.md"]
  - event: pull_request
    path:
      exclude: ["*.md"]
  - event: manual

labels:
  platform: linux/amd64

services:
  # For `test`: the store's #[sqlx::test]s and the spawned-binary accepttests.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund
  nats:
    image: nats:2.15-alpine
  mailpit:
    image: axllent/mailpit:v1.31
  # For `contract`: its own infrastructure, so the release binary starts on
  # an empty database and mailbox, as it did when this was its own workflow.
  contract-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund
  contract-nats:
    image: nats:2.15-alpine
  contract-mailpit:
    image: axllent/mailpit:v1.31

steps:
  lint:
    # The same image the shipped binary is built in, so a toolchain
    # difference cannot pass here and fail there. Its own target directory:
    # cargo locks a target directory per build, and lint runs beside test.
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # rustc outputs are shared across pipelines through sccache on
      # clank-sccache (memcached, the homelab). sccache keys each compile on its inputs,
      # the compiler and the environment variables rustc reads (build.rs's
      # revision too), so a hit is the output that compile would give; bin
      # crates, linking and build scripts are never cached. The cache needs no
      # credentials; if the host is unreachable, the step compiles without it.
      RUSTC_WRAPPER: sccache
      # From a secret: this repository is public and mirrored, and names no
      # internal address.
      SCCACHE_MEMCACHED_ENDPOINT:
        from_secret: sccache_memcached_endpoint
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/lint
    commands:
      # protobuf-dev: protoc and the well-known types, for the API codegen.
      - apk add --no-cache musl-dev protobuf-dev sccache
      - hp="$${SCCACHE_MEMCACHED_ENDPOINT#tcp://}"; nc -z -w 3 "$${hp%:*}" "$${hp##*:}" || { echo "the compile cache is unreachable, so this step compiles without it"; unset RUSTC_WRAPPER; }
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      # Kasper's rule: in Rust, the only comments are docs on public items.
      # Named step, so a refusal says what it is before clippy runs.
      - cargo run --locked -q -p comment-policy
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      # Official builds leave ee/ out; the ee build must keep compiling and
      # passing its accepttests anyway, so it is ready the day it ships.
      # --workspace, not -p grund: -p resolves features differently and
      # rebuilds most of the dependency tree instead of the crates ee touches.
      - cargo clippy --workspace --features grund/ee --all-targets --locked -- -D warnings
      - if [ -n "$${RUSTC_WRAPPER:-}" ]; then sccache --show-stats; fi

  proto:
    # The API contract is linted on every change, and a pull request may not
    # break it against main (skills D-19): generated clients depend on it.
    image: bufbuild/buf:1.73.0
    depends_on: []
    commands:
      - buf lint proto
      - if [ "$${CI_PIPELINE_EVENT}" = "pull_request" ]; then buf breaking proto --against "https://git.kjuulh.io/grund/grund.git#branch=main,subdir=proto"; fi

  test:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The image's own toolchain, so rustup does not read rust-toolchain.toml
      # and fetch clippy and rustfmt over the network in a step that never
      # lints (mail pipeline 7 failed on exactly that download).
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      # rustc outputs are shared across pipelines through sccache on
      # clank-sccache (memcached, the homelab). sccache keys each compile on its inputs,
      # the compiler and the environment variables rustc reads (build.rs's
      # revision too), so a hit is the output that compile would give; bin
      # crates, linking and build scripts are never cached. The cache needs no
      # credentials; if the host is unreachable, the step compiles without it.
      RUSTC_WRAPPER: sccache
      # From a secret: this repository is public and mirrored, and names no
      # internal address.
      SCCACHE_MEMCACHED_ENDPOINT:
        from_secret: sccache_memcached_endpoint
      # A CI build is never rebuilt incrementally, so writing incremental
      # state is pure cost; and full debuginfo makes the test binaries
      # slower to compile and link, while line tables keep file:line in a
      # panic's backtrace. Neither changes what the code does, and neither
      # reaches `release`.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The store's #[sqlx::test]s create a database per test from this one.
      DATABASE_URL: postgres://grund:grund@postgres:5432/grund
      GRUND_ACCEPT_DATABASE_URL: postgres://grund:grund@postgres:5432/grund
      GRUND_ACCEPT_NATS_URL: nats://nats:4222
      GRUND_ACCEPT_SMTP_URL: smtp://mailpit:1025
      GRUND_ACCEPT_MAILPIT_URL: http://mailpit:8025
    commands:
      - apk add --no-cache musl-dev protobuf-dev sccache
      - hp="$${SCCACHE_MEMCACHED_ENDPOINT#tcp://}"; nc -z -w 3 "$${hp%:*}" "$${hp##*:}" || { echo "the compile cache is unreachable, so this step compiles without it"; unset RUSTC_WRAPPER; }
      # Build every test binary first, and keep the path of the accepttest
      # binary: `contract` runs that same file against the release binary.
      # The same invocation as the run below, so the run compiles nothing.
      - mkdir -p .accept
      - cargo test --workspace --locked --no-run --message-format=json-render-diagnostics > .accept/build.json
      - grep '"reason":"compiler-artifact"' .accept/build.json | grep '/crates/grund#' | grep '"name":"tests"' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' > .accept/path
      - test "$$(wc -l < .accept/path)" -eq 1 || { echo "expected one grund accepttest binary, found:"; cat .accept/path; exit 1; }
      - cp "$$(cat .accept/path)" .accept/tests
      # Fail with the cause, not with thirty accepttests timing out.
      - for i in $(seq 1 60); do nc -z postgres 5432 && nc -z nats 4222 && nc -z mailpit 1025 && break; sleep 1; done
      - nc -z postgres 5432 || { echo "postgres never accepted connections"; exit 1; }
      - cargo test --workspace --locked
      # The ee accepttests: the workspace's tests with grund/ee, filtered to
      # the accepttests. Not `cargo test -p grund --features ee --test tests`:
      # -p resolves features differently and rebuilt 104 crates (pipeline 32);
      # this rebuilds only what the feature changes, and the filter reruns
      # only the accepttests, not the unit and store tests.
      - cargo test --workspace --features grund/ee --locked -- 'accepttest::'
      - if [ -n "$${RUSTC_WRAPPER:-}" ]; then sccache --show-stats; fi

  release:
    # rust:*-alpine targets musl natively: the release binary is static, which
    # is what lets it run on scratch. build.rs compiles CI_COMMIT_SHA into
    # /health/ready as "revision".
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The image's own toolchain, so rustup does not read rust-toolchain.toml
      # and fetch clippy and rustfmt over the network in a step that never
      # lints (mail pipeline 7 failed on exactly that download).
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      # rustc outputs are shared across pipelines through sccache on
      # clank-sccache (memcached, the homelab). sccache keys each compile on its inputs,
      # the compiler and the environment variables rustc reads (build.rs's
      # revision too), so a hit is the output that compile would give; bin
      # crates, linking and build scripts are never cached. The cache needs no
      # credentials; if the host is unreachable, the step compiles without it.
      RUSTC_WRAPPER: sccache
      # From a secret: this repository is public and mirrored, and names no
      # internal address.
      SCCACHE_MEMCACHED_ENDPOINT:
        from_secret: sccache_memcached_endpoint
      CARGO_INCREMENTAL: "0"
    commands:
      - apk add --no-cache musl-dev binutils protobuf-dev sccache
      - hp="$${SCCACHE_MEMCACHED_ENDPOINT#tcp://}"; nc -z -w 3 "$${hp%:*}" "$${hp##*:}" || { echo "the compile cache is unreachable, so this step compiles without it"; unset RUSTC_WRAPPER; }
      - cargo build --locked --release -p grund -p grund-guest
      - if [ -n "$${RUSTC_WRAPPER:-}" ]; then sccache --show-stats; fi
      - if readelf -d target/release/grund | grep -q NEEDED; then echo "grund is dynamically linked; scratch cannot run it"; exit 1; fi
      - if readelf -d target/release/grund-guest | grep -q NEEDED; then echo "grund-guest is dynamically linked; the guest has no libc"; exit 1; fi
      # A compile cache must never ship another commit's build: the binary
      # has to carry this commit's revision (build.rs, /health/ready).
      - tr -c 0-9a-f "\n" < target/release/grund | grep -q "$${CI_COMMIT_SHA}" || { echo "grund does not carry revision $${CI_COMMIT_SHA}"; exit 1; }
      # Stage the binary first and run the staged file, so the process the
      # accepttests assert against is byte for byte the one that gets packaged.
      - mkdir -p .image .dist && cp target/release/grund .image/grund && cp target/release/grund-guest .dist/grund-guest

  contract:
    # Assert against the real binary, not a mock of it: the accepttest binary
    # `test` compiled and ran against a spawned binary, pointed at the staged
    # release binary. The harness is a black-box HTTP client, so it does not
    # need to be compiled in release itself.
    image: rust:1.98.1-alpine3.24
    depends_on: [test, release]
    environment:
      GRUND_ACCEPT_MAILPIT_URL: http://contract-mailpit:8025
    commands:
      - apk add --no-cache openssl
      - for i in $(seq 1 60); do nc -z contract-postgres 5432 && nc -z contract-nats 4222 && nc -z contract-mailpit 1025 && break; sleep 1; done
      - >-
        GRUND_LISTEN=127.0.0.1:8080 GRUND_PUBLIC_URL=http://127.0.0.1:8080
        DATABASE_URL=postgres://grund:grund@contract-postgres:5432/grund
        GRUND_SECRET_KEY=$$(openssl rand -hex 32)
        GRUND_NATS_URL=nats://contract-nats:4222 GRUND_SMTP_URL=smtp://contract-mailpit:1025
        GRUND_WORK_POLL_INTERVAL=1 GRUND_HEALTH_INTERVAL=1
        GRUND_LOGIN_ATTEMPTS_PER_ADDRESS=0 GRUND_MAIL_REQUESTS_PER_ADDRESS=0
        GRUND_ENROLL_ATTEMPTS_PER_ADDRESS=0
        GRUND_ORGANISATIONS=multi
        ./.image/grund serve > server.log 2>&1 &
      # Every test reaches this one server from one address, so the
      # per-address limits are off here, and it runs as grund's hosted
      # service does (multi), because the tests sign up many accounts. The
      # spawned-binary run in `test` covers the limits and single mode.
      # cargo runs a test binary from its package directory; so does this.
      - cd crates/grund && GRUND_ACCEPT_URL=http://127.0.0.1:8080 ../../.accept/tests || { echo "--- server log"; cat ../../server.log; exit 1; }

  guest-image:
    # The microVM root filesystem, from the release step's binaries: the grund
    # that ships, and grund-guest as PID 1. Built without root; no compile.
    image: alpine:3.22
    depends_on: [release]
    commands:
      - apk add --no-cache bash coreutils e2fsprogs e2fsprogs-extra binutils git
      - git config --global --add safe.directory "$$PWD"
      - GRUND_BINARY=.image/grund GRUND_GUEST_BINARY=.dist/grund-guest crates/grund-guest/build-image.sh .dist/grund-guest.ext4
      - cp .image/grund .dist/grund
      - cd .dist && for f in grund grund-guest.ext4; do sha256sum "$$f" | cut -d' ' -f1 > "$$f.sha256"; done && ls -l

  artifacts-publish:
    # Versions are immutable: a re-run of the same commit is refused (409),
    # which is correct, so it is tolerated.
    image: alpine:3.22
    depends_on: [lint, proto, contract, guest-image]
    when:
      - event: push
        branch: main
      - event: manual
    environment:
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - apk add --no-cache curl
      # $$ escapes Woodpecker's own substitution; a single $ is swallowed.
      - for f in grund grund.sha256 grund-guest.ext4 grund-guest.ext4.sha256; do code=$$(curl -s -o /dev/null -w '%{http_code}' --user "kjuulh:$${REGISTRY_TOKEN}" --upload-file .dist/$$f "https://git.kjuulh.io/api/packages/grund/generic/grund/main-$${CI_COMMIT_SHA}/$$f"); case $$code in 201|409) echo "$$f $$code";; *) echo "upload of $$f failed with $$code"; exit 1;; esac; done

  # A broken Dockerfile fails the pull request that broke it, not the next
  # push to main. Builds, never pushes, and needs no secret.
  image-dry-run:
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [lint, proto, contract]
    when:
      - event: pull_request
    settings:
      dockerfile: Dockerfile.prebuilt
      context: .image
      repo: git.kjuulh.io/grund/grund
      platforms: linux/amd64
      dry_run: true
      auto_tag: false
      tags: ci-${CI_COMMIT_SHA_SHORT}

  image-publish:
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [lint, proto, contract]
    when:
      - event: push
        branch: main
      - event: manual
    settings:
      registry: git.kjuulh.io
      repo: git.kjuulh.io/grund/grund
      dockerfile: Dockerfile.prebuilt
      context: .image
      username: kjuulh
      password:
        from_secret: registry_token
      platforms: linux/amd64
      auto_tag: false
      tags:
        - main-${CI_COMMIT_SHA}
