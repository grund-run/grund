# Every gate, and the image, in one workflow, so the steps share one
# workspace and run side by side:
#
#   lint ──────────────┐
#   proto ─────────────┤
#   test ────┐         ├─ image-publish (push to main) / image-dry-run (PR)
#   release ─┴ contract┤
#   release ─ guest-image ─ artifacts-publish (push to main)
#
# `test` runs the unit tests and the accepttests against a binary cargo
# spawns; `release` builds the static binary that ships; `contract` runs the
# accepttest binary `test` already compiled against that staged release
# binary, so the artifact that ships is the one the accepttests assert
# against, and the accepttests are compiled once. The image is published only
# when every gate passed.
#
# Required Woodpecker secret (push to main only; pull requests use none):
#   registry_token: a git.kjuulh.io token for user kjuulh with package write
#   access to the grund organisation. Currently the instance-wide secret, the
#   same one grund/website uses.
#
# Beside the image, the static binary and a microVM guest image, as the Gitea
# generic package grund/generic/grund/main-<sha>/ (grund, grund-guest.ext4,
# and a .sha256 of each), with the same secret: what a device's `grund agent`
# runs, and the rootfs RunVm names by URL and SHA-256 (grund-docs
# design/vm-runtime.md).
#
# One immutable tag, main-${CI_COMMIT_SHA}. The public image is published
# for self-hosted deployments and rollback; this repository no longer
# annotates releases or owns the grund.sh Forest deployment. There is no
# latest or main tag, because a moving tag gives a rollback nothing to
# roll back to.
#
# A push or pull request that changes only documentation (*.md) runs nothing:
# no build reads those files. The next code change tests the whole tree.
when:
  - event: push
    branch: main
    path:
      exclude: ["*.md"]
  - event: pull_request
    path:
      exclude: ["*.md"]
  - event: manual
  # Versioned releases reuse every existing gate before their own packaging.
  - event: tag
    ref: refs/tags/v*

labels:
  platform: linux/amd64

services:
  # For `test`: the store's #[sqlx::test]s and the spawned-binary accepttests.
  # Every accepttest spawns a grund with a pool of its own, one test per
  # thread the agent gives the step, so 100 connections, the default, ran out
  # on a 24-thread agent ("sorry, too many clients already", pipeline 97).
  # 400, as compose.dev.yaml gives the same tests locally. Set through
  # initdb, not `commands:`: a service with commands runs under a shell that
  # never passes the stop signal on, so it was killed after a 20 s grace and
  # held the workflow open that long (PR pipeline 102).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund
      # No fsync: this database lives for one workflow, and every accepttest
      # creates a database of its own and runs every migration in it at
      # once. With fsync the commits queued on the disk (main pipeline 122:
      # 4 s to get a connection, 1-5 s per migration statement, three
      # servers never ready). Nothing here tests PostgreSQL's own crash
      # durability; restart tests restart grund, not the database.
      POSTGRES_INITDB_ARGS: "-c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off"
  nats:
    image: nats:2.15-alpine
  mailpit:
    image: axllent/mailpit:v1.31
  # Disposable S3-compatible endpoint for encrypted backup/restore contract
  # runs. SeaweedFS pre-creates the bucket; MinIO's images are no longer public.
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    environment:
      AWS_ACCESS_KEY_ID: grund-local
      AWS_SECRET_ACCESS_KEY: grund-local-backup-test-only
      S3_BUCKET: grund-backup-test
  # For `contract`: its own infrastructure, so the release binary starts on
  # an empty database and mailbox, as it did when this was its own workflow.
  contract-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund
      # As `postgres`, and for the same reason.
      POSTGRES_INITDB_ARGS: "-c fsync=off -c synchronous_commit=off -c full_page_writes=off"
  contract-nats:
    image: nats:2.15-alpine
  contract-mailpit:
    image: axllent/mailpit:v1.31

steps:
  lint:
    # The same image the shipped binary is built in, so a toolchain
    # difference cannot pass here and fail there. Its own target directory:
    # cargo locks a target directory per build, and lint runs beside test.
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The shared CI cache (grund-docs design/ci-cache.md): build steps read
      # the public cache without any key; only the push-only cache-save step
      # holds ci_cache_public. The release revision check still guards the
      # shipped binary.
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/lint
    commands:
      # protobuf-dev: protoc and the well-known types, for the API codegen.
      - apk add --no-cache musl-dev protobuf-dev sccache python3 git
      # Annotated-tag webhooks identify a tag object, not the checked-out commit.
      - python3 tools/test-release.py
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache restore lint --preset cargo; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      # At most 4 parallel rustc jobs on agent 1 (ratchet); see jobs.sh.
      - . .woodpecker/jobs.sh
      - rustup component add rustfmt clippy
      - cargo fmt --all --check
      # Kasper's rule: in Rust, the only comments are docs on public items.
      # Named step, so a refusal says what it is before clippy runs.
      - cargo run --locked -q -p comment-policy
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      # Official builds leave ee/ out; the ee build must keep compiling and
      # passing its accepttests anyway, so it is ready the day it ships.
      # --workspace, not -p grund: -p resolves features differently and
      # rebuilds most of the dependency tree instead of the crates ee touches.
      - cargo clippy --workspace --features grund/ee --all-targets --locked -- -D warnings
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'  # ci-cache: managed by kjuulh/woodpecker-forest

  proto:
    # The API contract is linted on every change, and a pull request may not
    # break it against main (skills D-19): generated clients depend on it.
    image: bufbuild/buf:1.73.0
    depends_on: []
    commands:
      - buf lint proto
      - if [ "$${CI_PIPELINE_EVENT}" = "pull_request" ]; then buf breaking proto --against "https://git.kjuulh.io/grund/grund.git#branch=main,subdir=proto"; fi

  test:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The image's own toolchain, so rustup does not read rust-toolchain.toml
      # and fetch clippy and rustfmt over the network in a step that never
      # lints (mail pipeline 7 failed on exactly that download).
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      # The shared CI cache (grund-docs design/ci-cache.md): build steps read
      # the public cache without any key; only the push-only cache-save step
      # holds ci_cache_public. The release revision check still guards the
      # shipped binary.
      # A CI build is never rebuilt incrementally, so writing incremental
      # state is pure cost; and full debuginfo makes the test binaries
      # slower to compile and link, while line tables keep file:line in a
      # panic's backtrace. Neither changes what the code does, and neither
      # reaches `release`.
      CARGO_INCREMENTAL: "0"
      # Its own target directory: test and release run side by side, and
      # each restores and saves its own snapshot.
      CARGO_TARGET_DIR: target/test
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # The store's #[sqlx::test]s create a database per test from this one.
      DATABASE_URL: postgres://grund:grund@postgres:5432/grund
      GRUND_ACCEPT_DATABASE_URL: postgres://grund:grund@postgres:5432/grund
      GRUND_ACCEPT_NATS_URL: nats://nats:4222
      GRUND_ACCEPT_SMTP_URL: smtp://mailpit:1025
      GRUND_ACCEPT_MAILPIT_URL: http://mailpit:8025
      GRUND_ACCEPT_S3_UPSTREAM: s3:8333
      # The certificate accepttests build a SHA-pinned Pebble source commit
      # with the ARI serial lookup fix (issue #550); go is only a test tool.
      # They fail rather than skip when Pebble is missing.
      GRUND_ACCEPT_REQUIRE_PEBBLE: "1"
      # Guards account enumeration by timing, so it runs alone after the
      # rest: beside 128 other tests a sign-in took anything from 16 ms to
      # 2.5 s, and the comparison measured the machine, not grund (grund-docs
      # docs/ci-performance.md). It is skipped once and run once, never
      # dropped.
      TIMING_TEST: accepttest::login::an_unknown_account_and_a_wrong_password_get_the_same_answer_in_the_same_time
    commands:
      # openssl (3.5 or later): the independent implementation grund-tls's
      # X25519MLKEM768 interop tests handshake against; they fail rather
      # than skip without it.
      - apk add --no-cache musl-dev protobuf-dev sccache openssl go curl bzip2 coreutils
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache restore test --preset cargo; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - crates/grund/tests/pebble/fetch.sh
      - curl -fsSL -o .accept-restic.bz2 https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2
      - echo '680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d  .accept-restic.bz2' | sha256sum -c -
      - mkdir -p .accept && bzip2 -dc .accept-restic.bz2 > .accept/restic && chmod 755 .accept/restic && rm .accept-restic.bz2
      - export GRUND_ACCEPT_RESTIC_BIN="$$PWD/.accept/restic"
      # At most 4 parallel rustc jobs on agent 1 (ratchet); see jobs.sh.
      - . .woodpecker/jobs.sh
      # Build and save EE first, then default, so the foreground Cargo run
      # uses its already-built default graph. Proto codegen watches inputs,
      # not its generated descriptor; otherwise every invocation is dirty.
      # Each suite keeps its own binary because the next feature build
      # overwrites target/test/debug/grund. --workspace keeps dependency
      # feature resolution consistent across the two builds.
      - mkdir -p .accept
      - cargo test --workspace --features grund/ee --locked --no-run --message-format=json-render-diagnostics > .accept/build-ee.json
      - grep '"reason":"compiler-artifact"' .accept/build-ee.json | grep '/crates/grund#' | grep '"name":"tests"' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' > .accept/path-ee
      - test "$$(wc -l < .accept/path-ee)" -eq 1 || { echo "expected one grund ee accepttest binary, found:"; cat .accept/path-ee; exit 1; }
      - cp "$$(cat .accept/path-ee)" .accept/tests-ee && cp target/test/debug/grund .accept/grund-ee
      # Keep the default build last; contract reuses this saved test binary.
      - cargo test --workspace --locked --no-run --message-format=json-render-diagnostics > .accept/build.json
      - grep '"reason":"compiler-artifact"' .accept/build.json | grep '/crates/grund#' | grep '"name":"tests"' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' > .accept/path
      - test "$$(wc -l < .accept/path)" -eq 1 || { echo "expected one grund accepttest binary, found:"; cat .accept/path; exit 1; }
      - cp "$$(cat .accept/path)" .accept/tests && cp target/test/debug/grund .accept/grund
      # Fail with the cause, not with thirty accepttests timing out.
      - for i in $(seq 1 60); do nc -z postgres 5432 && nc -z nats 4222 && nc -z mailpit 1025 && nc -z s3 8333 && break; sleep 1; done
      - nc -z postgres 5432 || { echo "postgres never accepted connections"; exit 1; }
      # The ee accepttests in the background, the workspace's tests in the
      # foreground; then both are reported, and the step fails if either
      # failed. cargo runs a test binary from its package directory; so does
      # the ee run.
      - |
        (cd crates/grund && ee=0 && { GRUND_ACCEPT_GRUND_BIN="$$PWD/../../.accept/grund-ee" ../../.accept/tests-ee 'accepttest::' --skip "$${TIMING_TEST}" > ../../.accept/ee.log 2>&1 || ee=$$?; } && echo "$$ee" > ../../.accept/ee.status) &
        core=0; GRUND_ACCEPT_GRUND_BIN="$$PWD/.accept/grund" cargo test --workspace --locked -- --skip "$${TIMING_TEST}" || core=$$?
        wait
        echo "--- the ee accepttests"; cat .accept/ee.log
        [ "$$core" -eq 0 ] && [ "$$(cat .accept/ee.status)" -eq 0 ] || { echo "workspace tests exited $$core, the ee accepttests $$(cat .accept/ee.status)"; exit 1; }
      # Saved executables keep the isolated timing runs free of Cargo work.
      - (cd crates/grund && GRUND_ACCEPT_GRUND_BIN="$$PWD/../../.accept/grund" ../../.accept/tests --exact "$${TIMING_TEST}")
      - cd crates/grund && GRUND_ACCEPT_GRUND_BIN="$$PWD/../../.accept/grund-ee" ../../.accept/tests-ee --exact "$${TIMING_TEST}"
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'  # ci-cache: managed by kjuulh/woodpecker-forest

  release:
    # rust:*-alpine targets musl natively: the release binary is static, which
    # is what lets it run on scratch. build.rs compiles CI_COMMIT_SHA into
    # /health/ready as "revision".
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      # The image's own toolchain, so rustup does not read rust-toolchain.toml
      # and fetch clippy and rustfmt over the network in a step that never
      # lints (mail pipeline 7 failed on exactly that download).
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      # The shared CI cache (grund-docs design/ci-cache.md): build steps read
      # the public cache without any key; only the push-only cache-save step
      # holds ci_cache_public. The release revision check still guards the
      # shipped binary.
      CARGO_INCREMENTAL: "0"
      # Its own target directory, as for test.
      CARGO_TARGET_DIR: target/release-build
    commands:
      # ca-certificates: the CA bundle the image ships (Dockerfile.prebuilt),
      # brought up to date here so the image build fetches nothing.
      - apk add --no-cache musl-dev binutils protobuf-dev sccache ca-certificates
      - 'command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl 2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part && mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached"; }'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then ci-cache restore release --preset cargo; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      - 'if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi'  # ci-cache: managed by kjuulh/woodpecker-forest
      # At most 4 parallel rustc jobs on agent 1 (ratchet); see jobs.sh.
      - . .woodpecker/jobs.sh
      - export GRUND_BUILD_TIME="$$(date -u '+%Y-%m-%d %H:%M UTC')"
      - cargo build --locked --release -p grund -p grund-guest
      - if readelf -d target/release-build/release/grund | grep -q NEEDED; then echo "grund is dynamically linked; scratch cannot run it"; exit 1; fi
      - if readelf -d target/release-build/release/grund-guest | grep -q NEEDED; then echo "grund-guest is dynamically linked; the guest has no libc"; exit 1; fi
      # A compile cache must never ship another commit's build: the binary
      # has to carry this commit's revision (build.rs, /health/ready).
      - tr -c 0-9a-f "\n" < target/release-build/release/grund | grep -q "$${CI_COMMIT_SHA}" || { echo "grund does not carry revision $${CI_COMMIT_SHA}"; exit 1; }
      # Stage the binary first and run the staged file, so the process the
      # accepttests assert against is byte for byte the one that gets packaged.
      - mkdir -p .image/var/lib/grund .dist && cp target/release-build/release/grund .image/grund && cp target/release-build/release/grund-guest .dist/grund-guest
      - cp /etc/ssl/certs/ca-certificates.crt .image/ca-certificates.crt
      - 'if command -v ci-cache >/dev/null; then ci-cache stats; fi'  # ci-cache: managed by kjuulh/woodpecker-forest

  contract:
    # Assert against the real binary, not a mock of it: the accepttest binary
    # `test` compiled and ran against a spawned binary, pointed at the staged
    # release binary. The harness is a black-box HTTP client, so it does not
    # need to be compiled in release itself.
    image: rust:1.98.1-alpine3.24
    depends_on: [test, release]
    environment:
      GRUND_ACCEPT_MAILPIT_URL: http://contract-mailpit:8025
      GRUND_ACCEPT_URL: http://127.0.0.1:8080
      # Alone after the rest, as in `test`.
      TIMING_TEST: accepttest::login::an_unknown_account_and_a_wrong_password_get_the_same_answer_in_the_same_time
    commands:
      - apk add --no-cache openssl curl
      - for i in $(seq 1 60); do nc -z contract-postgres 5432 && nc -z contract-nats 4222 && nc -z contract-mailpit 1025 && break; sleep 1; done
      # One durable key is shared by serve and setup-link, without logging or
      # publishing its value. Public sign-up starts only after the operator
      # owner has claimed the reserved admin organisation.
      - umask 077 && openssl rand -hex 32 > .accept/contract-secret
      - trap 'rm -f .accept/contract-secret' EXIT
      - >-
        GRUND_LISTEN=127.0.0.1:8080 GRUND_PUBLIC_URL=http://127.0.0.1:8080
        DATABASE_URL=postgres://grund:grund@contract-postgres:5432/grund
        GRUND_SECRET_KEY_FILE=.accept/contract-secret
        GRUND_NATS_URL=nats://contract-nats:4222 GRUND_SMTP_URL=smtp://contract-mailpit:1025
        GRUND_WORK_POLL_INTERVAL=1 GRUND_HEALTH_INTERVAL=1
        GRUND_LOGIN_ATTEMPTS_PER_ADDRESS=0 GRUND_MAIL_REQUESTS_PER_ADDRESS=0
        GRUND_ENROLL_ATTEMPTS_PER_ADDRESS=0
        GRUND_ORGANISATIONS=multi
        ./.image/grund serve > server.log 2>&1 &
      - >-
        GRUND_PUBLIC_URL=http://127.0.0.1:8080
        DATABASE_URL=postgres://grund:grund@contract-postgres:5432/grund
        GRUND_SECRET_KEY_FILE=.accept/contract-secret
        GRUND_ORGANISATIONS=multi
        ./accept-bootstrap.sh ./.image/grund
      # Every test reaches this one server from one address, so the
      # per-address limits are off here, and it runs as grund's hosted
      # service does (multi), because the tests sign up many accounts. The
      # spawned-binary run in `test` covers the limits and single mode.
      # cargo runs a test binary from its package directory; so does this.
      - cd crates/grund && { ../../.accept/tests --skip "$${TIMING_TEST}" && ../../.accept/tests --exact "$${TIMING_TEST}"; } || { echo "--- server log"; cat ../../server.log; exit 1; }

  guest-image:
    # The microVM root filesystem, from the release step's binaries: the grund
    # that ships, and grund-guest as PID 1. Built without root; no compile.
    image: alpine:3.22
    depends_on: [release]
    commands:
      - apk add --no-cache bash coreutils e2fsprogs e2fsprogs-extra binutils git
      - git config --global --add safe.directory "$$PWD"
      - GRUND_BINARY=.image/grund GRUND_GUEST_BINARY=.dist/grund-guest crates/grund-guest/build-image.sh .dist/grund-guest.ext4
      - cp .image/grund .dist/grund
      - cd .dist && for f in grund grund-guest.ext4; do sha256sum "$$f" | cut -d' ' -f1 > "$$f.sha256"; done && ls -l

  artifacts-publish:
    # Versions are immutable: a re-run of the same commit is refused (409),
    # which is correct, so it is tolerated.
    image: alpine:3.22
    depends_on: [lint, proto, contract, guest-image]
    when:
      - event: push
        branch: main
      - event: manual
    environment:
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - apk add --no-cache curl
      # $$ escapes Woodpecker's own substitution; a single $ is swallowed.
      - for f in grund grund.sha256 grund-guest.ext4 grund-guest.ext4.sha256; do code=$$(curl -s -o /dev/null -w '%{http_code}' --user "kjuulh:$${REGISTRY_TOKEN}" --upload-file .dist/$$f "https://git.kjuulh.io/api/packages/grund/generic/grund/main-$${CI_COMMIT_SHA}/$$f"); case $$code in 201|409) echo "$$f $$code";; *) echo "upload of $$f failed with $$code"; exit 1;; esac; done

  # A broken Dockerfile fails the pull request that broke it, not the next
  # push to main. Builds, never pushes, and needs no secret.
  image-dry-run:
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [lint, proto, contract]
    when:
      - event: pull_request
    settings:
      dockerfile: Dockerfile.prebuilt
      context: .image
      repo: git.kjuulh.io/grund/grund
      platforms: linux/amd64
      dry_run: true
      auto_tag: false
      tags: ci-${CI_COMMIT_SHA_SHORT}

  image-publish:
    image: woodpeckerci/plugin-docker-buildx:5
    depends_on: [lint, proto, contract]
    when:
      - event: push
        branch: main
      - event: manual
    settings:
      registry: git.kjuulh.io
      repo: git.kjuulh.io/grund/grund
      dockerfile: Dockerfile.prebuilt
      context: .image
      username: kjuulh
      password:
        from_secret: registry_token
      platforms: linux/amd64
      auto_tag: false
      tags:
        - main-${CI_COMMIT_SHA}

