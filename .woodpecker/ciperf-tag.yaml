# Branch-only derived copy of ci.yaml: simulated attribution, all gates, no writers.
when:
- event: push
  branch: ci/ciperf-shared-tag
labels:
  platform: linux/amd64
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund
      POSTGRES_INITDB_ARGS: -c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
  nats:
    image: nats:2.15-alpine
  mailpit:
    image: axllent/mailpit:v1.31
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    environment:
      AWS_ACCESS_KEY_ID: grund-local
      AWS_SECRET_ACCESS_KEY: grund-local-backup-test-only
      S3_BUCKET: grund-backup-test
  contract-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: grund
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund
      POSTGRES_INITDB_ARGS: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
  contract-nats:
    image: nats:2.15-alpine
  contract-mailpit:
    image: axllent/mailpit:v1.31
steps:
  lint:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/lint
    commands:
    - apk add --no-cache musl-dev protobuf-dev sccache python3 git
    - python3 tools/test-release.py
    - command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl
      2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl;
      else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo
      "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part &&
      mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached";
      }
    - if command -v ci-cache >/dev/null; then ci-cache restore lint --preset cargo; fi
    - if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi
    - . .woodpecker/jobs.sh
    - rustup component add rustfmt clippy
    - cargo fmt --all --check
    - cargo run --locked -q -p comment-policy
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo clippy --workspace --features grund/ee --all-targets --locked -- -D warnings
    - if command -v ci-cache >/dev/null; then ci-cache stats; fi
  proto:
    image: bufbuild/buf:1.73.0
    depends_on: []
    commands:
    - buf lint proto
    - if [ "$${CI_PIPELINE_EVENT}" = "pull_request" ]; then buf breaking proto --against "https://git.kjuulh.io/grund/grund.git#branch=main,subdir=proto"; fi
  test:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/test
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      DATABASE_URL: postgres://grund:grund@postgres:5432/grund
      GRUND_ACCEPT_DATABASE_URL: postgres://grund:grund@postgres:5432/grund
      GRUND_ACCEPT_NATS_URL: nats://nats:4222
      GRUND_ACCEPT_SMTP_URL: smtp://mailpit:1025
      GRUND_ACCEPT_MAILPIT_URL: http://mailpit:8025
      GRUND_ACCEPT_S3_UPSTREAM: s3:8333
      GRUND_ACCEPT_REQUIRE_PEBBLE: '1'
      TIMING_TEST: accepttest::login::an_unknown_account_and_a_wrong_password_get_the_same_answer_in_the_same_time
    commands:
    - apk add --no-cache musl-dev protobuf-dev sccache openssl go curl bzip2 coreutils
    - command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl
      2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl;
      else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo
      "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part &&
      mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached";
      }
    - if command -v ci-cache >/dev/null; then ci-cache restore test --preset cargo; fi
    - if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi
    - crates/grund/tests/pebble/fetch.sh
    - curl -fsSL -o .accept-restic.bz2 https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2
    - echo '680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d  .accept-restic.bz2' | sha256sum -c -
    - mkdir -p .accept && bzip2 -dc .accept-restic.bz2 > .accept/restic && chmod 755 .accept/restic && rm .accept-restic.bz2
    - export GRUND_ACCEPT_RESTIC_BIN="$$PWD/.accept/restic"
    - . .woodpecker/jobs.sh
    - mkdir -p .accept
    - cargo test --workspace --features grund/ee --locked --no-run --message-format=json-render-diagnostics > .accept/build-ee.json
    - grep '"reason":"compiler-artifact"' .accept/build-ee.json | grep '/crates/grund#' | grep '"name":"tests"' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' > .accept/path-ee
    - test "$$(wc -l < .accept/path-ee)" -eq 1 || { echo "expected one grund ee accepttest binary, found:"; cat .accept/path-ee; exit 1; }
    - cp "$$(cat .accept/path-ee)" .accept/tests-ee && cp target/test/debug/grund .accept/grund-ee
    - cargo test --workspace --locked --no-run --message-format=json-render-diagnostics > .accept/build.json
    - grep '"reason":"compiler-artifact"' .accept/build.json | grep '/crates/grund#' | grep '"name":"tests"' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' > .accept/path
    - test "$$(wc -l < .accept/path)" -eq 1 || { echo "expected one grund accepttest binary, found:"; cat .accept/path; exit 1; }
    - cp "$$(cat .accept/path)" .accept/tests && cp target/test/debug/grund .accept/grund
    - for i in $(seq 1 60); do nc -z postgres 5432 && nc -z nats 4222 && nc -z mailpit 1025 && nc -z s3 8333 && break; sleep 1; done
    - nc -z postgres 5432 || { echo "postgres never accepted connections"; exit 1; }
    - '(cd crates/grund && ee=0 && { GRUND_ACCEPT_GRUND_BIN="$$PWD/../../.accept/grund-ee" ../../.accept/tests-ee ''accepttest::'' --skip "$${TIMING_TEST}" > ../../.accept/ee.log 2>&1
      || ee=$$?; } && echo "$$ee" > ../../.accept/ee.status) &

      core=0; GRUND_ACCEPT_GRUND_BIN="$$PWD/.accept/grund" cargo test --workspace --locked -- --skip "$${TIMING_TEST}" || core=$$?

      wait

      echo "--- the ee accepttests"; cat .accept/ee.log

      [ "$$core" -eq 0 ] && [ "$$(cat .accept/ee.status)" -eq 0 ] || { echo "workspace tests exited $$core, the ee accepttests $$(cat .accept/ee.status)"; exit 1; }

      '
    - (cd crates/grund && GRUND_ACCEPT_GRUND_BIN="$$PWD/../../.accept/grund" ../../.accept/tests --exact "$${TIMING_TEST}")
    - cd crates/grund && GRUND_ACCEPT_GRUND_BIN="$$PWD/../../.accept/grund-ee" ../../.accept/tests-ee --exact "$${TIMING_TEST}"
    - if command -v ci-cache >/dev/null; then ci-cache stats; fi
  release:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    environment:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target/release-build
    commands:
    - export CI_COMMIT_TAG=v0.0.0-alpha.999999
    - apk add --no-cache musl-dev binutils protobuf-dev sccache ca-certificates python3 git
    - command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl
      2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl;
      else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo
      "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part &&
      mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached";
      }
    - if command -v ci-cache >/dev/null; then ci-cache restore release --preset cargo; fi
    - if command -v ci-cache >/dev/null; then eval "$$(ci-cache env)"; fi
    - . .woodpecker/jobs.sh
    - "export GRUND_REVISION=\"$$(git rev-parse \"$${CI_COMMIT_SHA}^{commit}\")\"\nif [ -n \"$${CI_COMMIT_TAG:-}\" ]; then\n  python3 tools/benchmark-shared-tag.py prepare\n  export\
      \ GRUND_VERSION=\"$${CI_COMMIT_TAG}\"\n  export GRUND_BUILD_TIME=\"$$(git show -s --format=%cI \"$${GRUND_REVISION}\")\"\nelse\n  export GRUND_BUILD_TIME=\"$$(date -u '+%Y-%m-%d\
      \ %H:%M UTC')\"\nfi\n"
    - cargo build --locked --release -p grund -p grund-guest
    - if readelf -d target/release-build/release/grund | grep -q NEEDED; then echo "grund is dynamically linked; scratch cannot run it"; exit 1; fi
    - if readelf -d target/release-build/release/grund-guest | grep -q NEEDED; then echo "grund-guest is dynamically linked; the guest has no libc"; exit 1; fi
    - tr -c 0-9a-f "\n" < target/release-build/release/grund | grep -q "$${GRUND_REVISION}" || { echo "grund does not carry revision $${GRUND_REVISION}"; exit 1; }
    - mkdir -p .image/var/lib/grund .dist && cp target/release-build/release/grund .image/grund && cp target/release-build/release/grund-guest .dist/grund-guest
    - cp /etc/ssl/certs/ca-certificates.crt .image/ca-certificates.crt
    - "if [ -n \"$${CI_COMMIT_TAG:-}\" ]; then\n  cp .image/grund scratch/tag-release/dist/grund-linux-amd64\n  python3 tools/benchmark-shared-tag.py verify-amd64\nfi\n"
    - if command -v ci-cache >/dev/null; then ci-cache stats; fi
  contract:
    image: rust:1.98.1-alpine3.24
    depends_on:
    - test
    - release
    environment:
      GRUND_ACCEPT_MAILPIT_URL: http://contract-mailpit:8025
      GRUND_ACCEPT_URL: http://127.0.0.1:8080
      TIMING_TEST: accepttest::login::an_unknown_account_and_a_wrong_password_get_the_same_answer_in_the_same_time
    commands:
    - apk add --no-cache openssl curl
    - for i in $(seq 1 60); do nc -z contract-postgres 5432 && nc -z contract-nats 4222 && nc -z contract-mailpit 1025 && break; sleep 1; done
    - umask 077 && openssl rand -hex 32 > .accept/contract-secret
    - trap 'rm -f .accept/contract-secret' EXIT
    - GRUND_LISTEN=127.0.0.1:8080 GRUND_PUBLIC_URL=http://127.0.0.1:8080 DATABASE_URL=postgres://grund:grund@contract-postgres:5432/grund GRUND_SECRET_KEY_FILE=.accept/contract-secret
      GRUND_NATS_URL=nats://contract-nats:4222 GRUND_SMTP_URL=smtp://contract-mailpit:1025 GRUND_WORK_POLL_INTERVAL=1 GRUND_HEALTH_INTERVAL=1 GRUND_LOGIN_ATTEMPTS_PER_ADDRESS=0 GRUND_MAIL_REQUESTS_PER_ADDRESS=0
      GRUND_ENROLL_ATTEMPTS_PER_ADDRESS=0 GRUND_ORGANISATIONS=multi ./.image/grund serve > server.log 2>&1 &
    - GRUND_PUBLIC_URL=http://127.0.0.1:8080 DATABASE_URL=postgres://grund:grund@contract-postgres:5432/grund GRUND_SECRET_KEY_FILE=.accept/contract-secret GRUND_ORGANISATIONS=multi
      ./accept-bootstrap.sh ./.image/grund
    - cd crates/grund && { ../../.accept/tests --skip "$${TIMING_TEST}" && ../../.accept/tests --exact "$${TIMING_TEST}"; } || { echo "--- server log"; cat ../../server.log; exit 1;
      }
  guest-image:
    image: alpine:3.22
    depends_on:
    - release
    commands:
    - apk add --no-cache bash coreutils e2fsprogs e2fsprogs-extra binutils git
    - git config --global --add safe.directory "$$PWD"
    - GRUND_BINARY=.image/grund GRUND_GUEST_BINARY=.dist/grund-guest crates/grund-guest/build-image.sh .dist/grund-guest.ext4
    - cp .image/grund .dist/grund
    - cd .dist && for f in grund grund-guest.ext4; do sha256sum "$$f" | cut -d' ' -f1 > "$$f.sha256"; done && ls -l
  linux-arm64:
    image: rust:1.98.1-alpine3.24
    depends_on: []
    when:
    - event: push
      branch: ci/ciperf-shared-tag
    environment:
      CARGO_BUILD_JOBS: '4'
      CARGO_BUILD_TARGET: aarch64-unknown-linux-musl
      CARGO_TARGET_DIR: target/release-arm64
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.98.1-x86_64-unknown-linux-musl
    commands:
    - export CI_COMMIT_TAG=v0.0.0-alpha.999999
    - apk add --no-cache musl-dev binutils protobuf-dev sccache ca-certificates curl python3 xz qemu-aarch64 git
    - command -v ci-cache >/dev/null || { (curl -fsS --connect-timeout 5 --max-time 60 -o /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl
      2>/dev/null || { if command -v timeout >/dev/null; then timeout 60 wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl;
      else wget -q -T 5 -O /usr/local/bin/.ci-cache.part https://git.kjuulh.io/api/packages/kjuulh/generic/ci-cache/0.3.1/ci-cache-0.3.1-x86_64-linux-musl; fi; } 2>/dev/null) && echo
      "460ac0386515e7ce2704c65e414ed1ee2a938fe0b1ed05ec8dd363d9ef3a5f7e  /usr/local/bin/.ci-cache.part" | sha256sum -c - >/dev/null 2>&1 && chmod 0755 /usr/local/bin/.ci-cache.part &&
      mv /usr/local/bin/.ci-cache.part /usr/local/bin/ci-cache; rm -f /usr/local/bin/.ci-cache.part; command -v ci-cache >/dev/null || echo "ci-cache client unavailable, building uncached";
      }
    - if command -v ci-cache >/dev/null; then ci-cache restore release-arm64 --preset cargo --dir scratch/tag-release/tooling; eval "$$(ci-cache env)"; fi
    - sh tools/release-build.sh arm64
  released-binary-runtime:
    image: alpine:3.24.0
    depends_on:
    - release
    - release-postgres
    - release-nats
    when:
    - event: push
      branch: ci/ciperf-shared-tag
    environment:
      GRUND_RELEASE_DATABASE_URL: postgres://grund:grund-release-disposable@release-postgres:5432/grund_release
      GRUND_RELEASE_NATS_URL: nats://release-nats:4222
    commands:
    - apk add --no-cache python3 curl openssl git
    - cmp .image/grund scratch/tag-release/dist/grund-linux-amd64
    - sha256sum .image/grund scratch/tag-release/dist/grund-linux-amd64
    - python3 tools/release-runtime.py scratch/tag-release/dist/grund-linux-amd64
  image-amd64:
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    depends_on:
    - released-binary-runtime
    when:
    - event: push
      branch: ci/ciperf-shared-tag
    settings:
      dockerfile: Dockerfile.prebuilt
      context: scratch/tag-release/image-amd64
      repo: git.kjuulh.io/grund/grund
      platforms: linux/amd64
      tags: ciperf-${CI_COMMIT_SHA_SHORT}-amd64
      auto_tag: false
      default_labels: false
      provenance: false
      build_args:
        SOURCE_DATE_EPOCH: '0'
      dry_run: true
      output: type=oci,dest=scratch/tag-release/image-amd64.tar
  image-arm64:
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    depends_on:
    - linux-arm64
    when:
    - event: push
      branch: ci/ciperf-shared-tag
    settings:
      dockerfile: Dockerfile.prebuilt
      context: scratch/tag-release/image-arm64
      repo: git.kjuulh.io/grund/grund
      platforms: linux/arm64
      tags: ciperf-${CI_COMMIT_SHA_SHORT}-arm64
      auto_tag: false
      default_labels: false
      provenance: false
      build_args:
        SOURCE_DATE_EPOCH: '0'
      dry_run: true
      output: type=oci,dest=scratch/tag-release/image-arm64.tar
  release-postgres:
    image: postgres:18-alpine
    depends_on: []
    detach: true
    when:
    - event: push
      branch: ci/ciperf-shared-tag
    environment:
      POSTGRES_DB: grund_release
      POSTGRES_USER: grund
      POSTGRES_PASSWORD: grund-release-disposable
      POSTGRES_INITDB_ARGS: -c fsync=off -c synchronous_commit=off -c full_page_writes=off
  release-nats:
    image: nats:2.15-alpine
    depends_on: []
    detach: true
    when:
    - event: push
      branch: ci/ciperf-shared-tag
  verify-release-images:
    image: alpine:3.24.0
    depends_on:
    - lint
    - proto
    - contract
    - guest-image
    - image-amd64
    - image-arm64
    when:
    - event: push
      branch: ci/ciperf-shared-tag
    commands:
    - export CI_COMMIT_TAG=v0.0.0-alpha.999999
    - apk add --no-cache python3 git ca-certificates
    - python3 tools/benchmark-shared-tag.py merge-images
    - cat scratch/tag-release/dist/SHA256SUMS
