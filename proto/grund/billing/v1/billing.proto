syntax = "proto3";

package grund.billing.v1;

import "google/protobuf/timestamp.proto";

// What grund asks of a billing service. grund's hosted service runs one; a
// self-hosted grund has none and never calls it. The billing service owns
// plans, payment details and invoices; grund owns organisations and tells it
// when they change. Calls carry `Authorization: Bearer <token>`, the token
// grund is configured with (GRUND_BILLING_TOKEN), and come from grund's
// servers only, never from browsers.
service BillingService {
  // The organisation's billing account as its owners should see it. An
  // organisation billing has not heard of yet is on the free plan.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Resolves an existing invoice document for one organisation. No invoice is
  // generated by this read; an order without a generated document is not found.
  rpc GetInvoiceLink(GetInvoiceLinkRequest) returns (GetInvoiceLinkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // An organisation was created, renamed or deleted. Sent at least once and
  // not necessarily in order: changed_at orders the changes of one
  // organisation, and the service must ignore an event_id it has seen.
  rpc RecordOrganisation(RecordOrganisationRequest) returns (RecordOrganisationResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Whether the organisation may be deleted now (for example, not while an
  // invoice is unpaid). grund refuses the deletion unless allowed is true.
  rpc CheckDeletion(CheckDeletionRequest) returns (CheckDeletionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc BeginCheckout(BeginCheckoutRequest) returns (BeginCheckoutResponse);
  rpc ChangePlan(ChangePlanRequest) returns (ChangePlanResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  // A distinct paid rental, never an own-machine licence or redirect-based grant.
  rpc BeginRentalCheckout(BeginRentalCheckoutRequest) returns (BeginRentalCheckoutResponse);
  // Requests period-end cancellation; does not delete workloads or end paid time.
  rpc CancelRental(CancelRentalRequest) returns (CancelRentalResponse);
  rpc OpenPortal(OpenPortalRequest) returns (OpenPortalResponse);
  rpc RecordMachineCount(RecordMachineCountRequest) returns (RecordMachineCountResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc RecordMachineChange(RecordMachineChangeRequest) returns (RecordMachineChangeResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc SetComplimentary(SetComplimentaryRequest) returns (SetComplimentaryResponse);
  // Operator-only diagnostics. The trusted caller authorizes operator access.
  rpc ListProviderCommands(ListProviderCommandsRequest) returns (ListProviderCommandsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Operator attests no provider effect, or that a legacy checkout is closed
  // and unpaid. Never repeats a provider mutation or treats absence as proof.
  rpc ResolveProviderCommand(ResolveProviderCommandRequest) returns (ResolveProviderCommandResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetAccountRequest {
  // UUIDv7.
  string organisation_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message Account {
  // The plan's display name, e.g. "Homelab" or "Pro".
  string plan = 1;
  AccountStatus status = 2;
  // The billing service's own page where owners manage payment details and
  // invoices. Empty when there is nothing to manage.
  string manage_url = 3;
  string pending_plan = 4;
  bool complimentary = 5;
  google.protobuf.Timestamp complimentary_expires_at = 6;
  int64 total_amount_cents = 7;
  string currency = 8;
  string complimentary_reason = 9;
  // A paid subscription remains charged until the next-cycle grant is
  // verified effective by the provider. Never infer €0 from this schedule.
  string complimentary_scheduled_plan = 10;
  bool complimentary_scheduled = 11;
  google.protobuf.Timestamp complimentary_effective_at = 12;
  // Operator-only payment-provider dashboard for manual refund decisions.
  string operator_url = 13;
  // Provider subscription UUID for an operator's manual refund lookup.
  string provider_subscription_id = 14;
  // Absent for a free account or an older subscription not yet refreshed.
  google.protobuf.Timestamp period_start = 15;
  google.protobuf.Timestamp period_end = 16;
  bool cancel_at_period_end = 17;
  // Present only for a provider subscription with a known current period.
  UsagePeriod usage = 18;
  // At most 20 recent observed orders, newest first; no provider secrets.
  repeated BillingInvoice invoices = 19;
  // Presence is authoritative, including disabled or zero limits. Missing
  // authority or a failed billing read never grants an interim allowance.
  HostedEntitlement hosted_entitlement = 20;
  // Display-only explanation. Never grants allocation or replaces fresh
  // hosted_entitlement authority, including when this reason is GRANTED.
  HostedEntitlementReason hosted_entitlement_reason = 21;
  repeated Rental rentals = 22;
}

// Absolute organisation-wide ceilings, including reserved/provisioning hosted
// machines. A denial blocks new allocation, never removes existing machines.
message HostedEntitlement {
  bool enabled = 1;
  uint32 max_machines = 2;
  uint32 max_vcpus = 3;
  uint64 max_memory_mib = 4;
}

enum HostedEntitlementReason {
  HOSTED_ENTITLEMENT_REASON_UNSPECIFIED = 0;
  HOSTED_ENTITLEMENT_REASON_GRANTED = 1;
  HOSTED_ENTITLEMENT_REASON_ORGANISATION_NOT_SYNCED = 2;
  HOSTED_ENTITLEMENT_REASON_ALLOWANCE_DISABLED = 3;
  HOSTED_ENTITLEMENT_REASON_NO_PLAN = 4;
  HOSTED_ENTITLEMENT_REASON_BILLING_LIVE_NO_MAPPING = 5;
}

message UsagePeriod {
  // The latest delivered hourly own-machine count, not a live inventory read.
  int32 machines_billed = 1;
  // Sum of delivered own-machine counts over completed hours in this period.
  int64 machine_hours = 2;
  int64 sampled_hours = 3;
  // Completed hours since period_start. A gap means the estimate is incomplete.
  int64 expected_hours = 4;
  // Monthly-rate estimate from delivered hourly samples, not a Polar invoice.
  // Absent until at least one sample was delivered.
  optional int64 estimated_amount_cents = 5;
  // Homelab's applied first-machine credit in the estimate, not a provider receipt.
  int64 first_machine_credit_cents = 6;
}

message BillingInvoice {
  // Polar order UUID; never a customer or subscription identifier.
  string id = 1;
  // Authoritative Polar order creation time, absent for older unrefreshed orders.
  google.protobuf.Timestamp date = 2;
  int64 amount_cents = 3;
  string currency = 4;
  string status = 5;
  // Only true after Polar reports an invoice document was generated.
  bool document_available = 6;
  google.protobuf.Timestamp observed_at = 7;
  // Provider refunded_amount observation, absent when unknown. Refunded tax
  // is reported separately; this field alone is not a gross-refund guarantee.
  optional int64 refunded_amount_cents = 8;
  // unknown, pending, paid, partially_refunded, refunded or void. Refunds
  // do not independently decide entitlement or remove running machines.
  string financial_status = 9;
  optional int64 refunded_tax_amount_cents = 10;
}

message GetInvoiceLinkRequest {
  string organisation_id = 1;
  string invoice_id = 2;
}

message GetInvoiceLinkResponse {
  // Short-lived provider-hosted document URL. Only return HTTPS links.
  string url = 1;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // Nothing is owed, or payment is up to date.
  ACCOUNT_STATUS_ACTIVE = 1;
  // A payment failed; owners should update payment details.
  ACCOUNT_STATUS_PAST_DUE = 2;
  ACCOUNT_STATUS_CANCELLED = 3;
  // Payment or checkout has not completed; not proof of a paid entitlement.
  ACCOUNT_STATUS_INCOMPLETE = 4;
  ACCOUNT_STATUS_PAUSED = 5;
}

message RecordOrganisationRequest {
  // Unique per change; the same change is sent with the same id.
  string event_id = 1;
  string organisation_id = 2;
  // The slug after the change.
  string slug = 3;
  OrganisationChange change = 4;
  google.protobuf.Timestamp changed_at = 5;
}

enum OrganisationChange {
  ORGANISATION_CHANGE_UNSPECIFIED = 0;
  ORGANISATION_CHANGE_CREATED = 1;
  ORGANISATION_CHANGE_RENAMED = 2;
  ORGANISATION_CHANGE_DELETED = 3;
}

message RecordOrganisationResponse {}

message CheckDeletionRequest {
  string organisation_id = 1;
}

message CheckDeletionResponse {
  bool allowed = 1;
  // Shown to the owner when allowed is false, e.g. "An invoice is unpaid."
  string reason = 2;
}

message BeginCheckoutRequest {
  string organisation_id = 1;
  string plan = 2;
  string success_url = 3;
  string idempotency_key = 4;
}

message BeginCheckoutResponse {
  string url = 1;
}

message BeginRentalCheckoutRequest {
  string organisation_id = 1;
  string rental_id = 2;
  // small, medium, large or dedicated.
  string size = 3;
  string success_url = 4;
  string idempotency_key = 5;
}

message BeginRentalCheckoutResponse { string url = 1; }

message CancelRentalRequest {
  string organisation_id = 1;
  string rental_id = 2;
  string idempotency_key = 3;
}

message CancelRentalResponse { Account account = 1; }

message Rental {
  string rental_id = 1;
  string size = 2;
  // pending, active, past_due, incomplete, paused, canceled or incomplete_expired.
  string status = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
  bool cancel_at_period_end = 6;
  int64 monthly_cap_cents = 7;
  // Completed machine-hours observed in the authoritative current period.
  int64 completed_hours = 8;
  // Cumulative delivered rental cents; absent before a provider observation.
  optional int64 observed_amount_cents = 9;
  string currency = 10;
}

message ChangePlanRequest {
  string organisation_id = 1;
  string plan = 2;
  string idempotency_key = 3;
}

message ChangePlanResponse {
  Account account = 1;
}

message CancelSubscriptionRequest {
  string organisation_id = 1;
  string idempotency_key = 2;
}

message CancelSubscriptionResponse {
  Account account = 1;
}

message OpenPortalRequest {
  string organisation_id = 1;
  string return_url = 2;
  string idempotency_key = 3;
  // Empty selects the separate own-machine customer, otherwise this rental.
  string rental_id = 4;
}

message OpenPortalResponse {
  string url = 1;
}

message RecordMachineCountRequest {
  string event_id = 1;
  string organisation_id = 2;
  google.protobuf.Timestamp sampled_at = 3;
  int32 machines = 4;
  string idempotency_key = 5;
}

message RecordMachineCountResponse {}

enum MachineChange {
  MACHINE_CHANGE_UNSPECIFIED = 0;
  MACHINE_CHANGE_CREATED = 1;
  MACHINE_CHANGE_REMOVED = 2;
}

// Rental leases are reconciled separately from own-machine licence samples.
enum MachineKind {
  MACHINE_KIND_UNSPECIFIED = 0;
  MACHINE_KIND_OWN = 1;
  MACHINE_KIND_HOSTED = 2;
}

message RecordMachineChangeRequest {
  string event_id = 1;
  string organisation_id = 2;
  string machine_id = 3;
  MachineChange change = 4;
  google.protobuf.Timestamp changed_at = 5;
  string idempotency_key = 6;
  MachineKind machine_kind = 7;
  // HOSTED: the UUID supplied to BeginRentalCheckout, not a provider order ID.
  string order_id = 8;
  string size = 9;
  string region = 10;
}

message RecordMachineChangeResponse {}

message SetComplimentaryRequest {
  string organisation_id = 1;
  bool enabled = 2;
  string plan = 3;
  string reason = 4;
  google.protobuf.Timestamp expires_at = 5;
  string actor_id = 6;
  string idempotency_key = 7;
}

message SetComplimentaryResponse {
  Account account = 1;
}

message ProviderCommand {
  string command_id = 1;
  string method = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListProviderCommandsRequest {
  string organisation_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListProviderCommandsResponse {
  repeated ProviderCommand commands = 1;
  string next_page_token = 2;
}

enum ProviderCommandOutcome {
  PROVIDER_COMMAND_OUTCOME_UNSPECIFIED = 0;
  PROVIDER_COMMAND_OUTCOME_NOT_APPLIED = 1;
  // A created legacy checkout is confirmed closed/unpaid, with no current
  // subscription. This is not a claim that session creation never happened.
  PROVIDER_COMMAND_OUTCOME_CHECKOUT_CLOSED = 2;
}

message ResolveProviderCommandRequest {
  string organisation_id = 1;
  string command_id = 2;
  string actor_id = 3;
  string reason = 4;
  ProviderCommandOutcome outcome = 5;
}

message ResolveProviderCommandResponse {}
