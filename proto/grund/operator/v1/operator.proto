syntax = "proto3";

package grund.operator.v1;

import "google/protobuf/timestamp.proto";

// Inventory and hosted access for the instance's operator organisation only.
// Non-operator callers receive not_found; members read, owners and admins act.
service OperatorService {
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListFleetMachines(ListFleetMachinesRequest) returns (ListFleetMachinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListFailures(ListFailuresRequest) returns (ListFailuresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc CordonHost(CordonHostRequest) returns (CordonHostResponse);
  rpc UncordonHost(UncordonHostRequest) returns (UncordonHostResponse);
  rpc DrainHost(DrainHostRequest) returns (DrainHostResponse);
  rpc ListEntitlements(ListEntitlementsRequest) returns (ListEntitlementsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetHostedEntitlement(SetHostedEntitlementRequest) returns (SetHostedEntitlementResponse);
  rpc GetBillingAccount(GetBillingAccountRequest) returns (GetBillingAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetComplimentary(SetComplimentaryRequest) returns (SetComplimentaryResponse);
}

message ResourceCapacity {
  int32 vcpus = 1;
  int64 memory_mib = 2;
  int64 disk_gib = 3;
}

message Host {
  string id = 1;
  string name = 2;
  string state = 3;
  string provider = 4;
  string region = 5;
  ResourceCapacity capacity = 6;
  ResourceCapacity allocated = 7;
  string kernel = 8;
  string firecracker_version = 9;
  bool reachable = 10;
  google.protobuf.Timestamp last_seen_at = 11;
  int32 machine_count = 12;
  string cordon_reason = 13;
}

message FleetMachine {
  string id = 1;
  string host_id = 2;
  string state = 3;
  string size = 4;
  string region = 5;
  string reason = 6;
  bool assigned = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Pool {
  string id = 1;
  string name = 2;
  string size = 3;
  string region = 4;
  int32 desired = 5;
  int32 warm = 6;
  int32 ready = 7;
  string unschedulable_reason = 8;
}

message Failure {
  string machine_id = 1;
  string host_id = 2;
  string state = 3;
  string reason = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListHostsRequest { int32 page_size = 1; string page_token = 2; }
message ListHostsResponse { repeated Host hosts = 1; string next_page_token = 2; }
message ListFleetMachinesRequest { string host_id = 1; int32 page_size = 2; string page_token = 3; }
message ListFleetMachinesResponse { repeated FleetMachine machines = 1; string next_page_token = 2; }
message ListPoolsRequest { int32 page_size = 1; string page_token = 2; }
message ListPoolsResponse { repeated Pool pools = 1; string next_page_token = 2; }
message ListFailuresRequest { int32 page_size = 1; string page_token = 2; }
message ListFailuresResponse { repeated Failure failures = 1; string next_page_token = 2; }
message CordonHostRequest { string host_id = 1; string reason = 2; }
message UncordonHostRequest { string host_id = 1; }
message DrainHostRequest { string host_id = 1; }
message CordonHostResponse { Host host = 1; }
message UncordonHostResponse { Host host = 1; }
message DrainHostResponse { Host host = 1; }
message ListEntitlementsRequest {}
message HostedEntitlement { string organisation = 1; bool enabled = 2; }
message ListEntitlementsResponse { repeated HostedEntitlement organisations = 1; }
message SetHostedEntitlementRequest { string organisation = 1; bool enabled = 2; }
message SetHostedEntitlementResponse { HostedEntitlement organisation = 1; }
message GetBillingAccountRequest { string organisation = 1; }
message GetBillingAccountResponse {
  string organisation = 1;
  string plan = 2;
  string pending_plan = 3;
  bool complimentary = 4;
  string complimentary_reason = 5;
  string complimentary_expires_at = 6;
  bool past_due = 7;
  int64 total_amount_cents = 8;
  string currency = 9;
  string complimentary_scheduled_plan = 10;
  bool complimentary_scheduled = 11;
  string complimentary_effective_at = 12;
  string operator_url = 13;
  string provider_subscription_id = 14;
}
message SetComplimentaryRequest {
  string organisation = 1;
  bool enabled = 2;
  string plan = 3;
  string reason = 4;
  string expires_at = 5;
  string idempotency_key = 6;
}
message SetComplimentaryResponse { GetBillingAccountResponse account = 1; }
