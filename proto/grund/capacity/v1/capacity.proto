syntax = "proto3";

package grund.capacity.v1;

import "google/protobuf/timestamp.proto";

// What grund asks of a capacity provider: somewhere its management pool gets
// machines from (grund-docs design/machines.md). An instance without a provider
// adds machines to its pool by hand and never calls this service. Calls carry
// `Authorization: Bearer <token>`, the token grund is configured with
// (GRUND_CAPACITY_TOKEN), and come from grund's servers only.
//
// The enrollment tokens in machine requests are one-time grund_reg_ tokens
// valid for at most 15 minutes. The provider holds them only for delivery to
// the machine, deleting them on confirmation or expiry; they are never returned in
// inventory or logged. The machine registers itself with grund (`grund join`).
//
// Machine lifecycle requests carry idempotency_key; a repeat of the same
// request returns its first answer. Read requests have no side effects.
// unavailable means the provider cannot act now; failed_precondition means capacity
// is unplaceable or the requested machine cannot be acted on.
service CapacityService {
  // Boots a new machine that will register into grund's management pool
  // with enrollment_token.
  rpc ProvisionMachine(ProvisionMachineRequest) returns (ProvisionMachineResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Resolves a timed-out provision without replaying its enrollment token.
  // A missing/expired key (or one not provisioned for grund) returns found=false.
  rpc GetProvision(GetProvisionRequest) returns (GetProvisionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Wipes a machine (a fresh root disk from its image) and boots it with a
  // re-registration token, after its lease ended. It keeps its identity at
  // the provider.
  rpc RebuildMachine(RebuildMachineRequest) returns (RebuildMachineResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Stops the machine and gives it back; grund has revoked it first.
  rpc ReleaseMachine(ReleaseMachineRequest) returns (ReleaseMachineResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Configured provider size/region offers; READY is immediately assignable.
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Provider inventory through grund's server only, not a browser token.
  rpc ListInventoryHosts(ListInventoryHostsRequest) returns (ListInventoryHostsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListInventoryMachines(ListInventoryMachinesRequest) returns (ListInventoryMachinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListInventoryPools(ListInventoryPoolsRequest) returns (ListInventoryPoolsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListInventoryFailures(ListInventoryFailuresRequest) returns (ListInventoryFailuresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListInventoryEvents(ListInventoryEventsRequest) returns (ListInventoryEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // These actions follow the provider's host lifecycle decisions.
  rpc CordonInventoryHost(CordonInventoryHostRequest) returns (CordonInventoryHostResponse);
  rpc UncordonInventoryHost(UncordonInventoryHostRequest) returns (UncordonInventoryHostResponse);
  rpc DrainInventoryHost(DrainInventoryHostRequest) returns (DrainInventoryHostResponse);

  // A provider-backed agent needs this durable fence before Core authorizes
  // executable replacement. A denied/unavailable reservation never permits it.
  rpc AcquireMachineUpdateFence(AcquireMachineUpdateFenceRequest) returns (AcquireMachineUpdateFenceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Closes delayed acquisitions through sequence, but clears an existing grant
  // only for the matching attempt and sequence, never a different authorization.
  rpc ReleaseMachineUpdateFence(ReleaseMachineUpdateFenceRequest) returns (ReleaseMachineUpdateFenceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message ProvisionMachineRequest {
  string idempotency_key = 1;
  // Where the machine registers, e.g. https://app.grund.sh.
  string grund_url = 2;
  string enrollment_token = 3;
  google.protobuf.Timestamp token_expires_at = 4;
  // The provider's size name; empty for its default.
  string size = 5;
  // Empty selects the configured pool's region.
  string region = 6;
}

message ProvisionMachineResponse {
  // The provider's id for the machine: what grund names in RebuildMachine and
  // ReleaseMachine.
  string provider_machine_id = 1;
}

message GetProvisionRequest {
  // The key originally sent to ProvisionMachine; no enrollment token needed.
  string idempotency_key = 1;
}
message GetProvisionResponse {
  // Set only when found=true.
  string provider_machine_id = 1;
  bool found = 2;
}

message RebuildMachineRequest {
  string idempotency_key = 1;
  string provider_machine_id = 2;
  string grund_url = 3;
  string enrollment_token = 4;
  google.protobuf.Timestamp token_expires_at = 5;
}

message RebuildMachineResponse {}

message ReleaseMachineRequest {
  string idempotency_key = 1;
  string provider_machine_id = 2;
}

message ReleaseMachineResponse {}

message ListOffersRequest {}
message ListOffersResponse { repeated CapacityOffer offers = 1; }
message CapacityOffer {
  string size = 1;
  string region = 2;
  int32 vcpus = 3;
  int64 memory_mib = 4;
  int64 disk_gib = 5;
  // Unassigned machines requested, placed, started or booted.
  int32 warm = 6;
  // Unassigned booted machines; available for an immediate lease.
  int32 ready = 7;
  // Ready exists, or a new machine can immediately fit on a reachable host.
  bool can_place = 8;
}

message ListInventoryHostsRequest { int32 page_size = 1; string page_token = 2; }
message ListInventoryHostsResponse { repeated InventoryHost hosts = 1; string next_page_token = 2; }
message InventoryHost {
  string id = 1;
  string name = 2;
  string provider = 3;
  string region = 4;
  string state = 5;
  int32 vcpus = 6;
  int64 memory_mib = 7;
  int64 disk_gib = 8;
  int32 allocated_vcpus = 9;
  int64 allocated_memory_mib = 10;
  int64 allocated_disk_gib = 11;
  bool reachable = 12;
  google.protobuf.Timestamp last_heartbeat_at = 13;
  int32 machine_count = 14;
  string cordon_reason = 15;
  string host_kernel = 16;
  string firecracker_version = 17;
}

message ListInventoryMachinesRequest { string host_id = 1; int32 page_size = 2; string page_token = 3; }
message ListInventoryMachinesResponse { repeated InventoryMachine machines = 1; string next_page_token = 2; }
message InventoryMachine {
  string id = 1;
  string host_id = 2;
  string pool_id = 3;
  string provider = 4;
  string region = 5;
  string size = 6;
  string state = 7;
  bool assigned = 8;
  string reason = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ListInventoryPoolsRequest { int32 page_size = 1; string page_token = 2; }
message ListInventoryPoolsResponse { repeated InventoryPool pools = 1; string next_page_token = 2; }
message InventoryPool {
  string id = 1;
  string name = 2;
  string provider = 3;
  string region = 4;
  string size = 5;
  int32 desired = 6;
  int32 headroom = 7;
  int32 warm = 8;
  int32 ready = 9;
  string unschedulable_reason = 10;
}

message ListInventoryFailuresRequest { int32 page_size = 1; string page_token = 2; }
message ListInventoryFailuresResponse { repeated InventoryFailure failures = 1; string next_page_token = 2; }
message InventoryFailure {
  string machine_id = 1;
  string host_id = 2;
  string pool_id = 3;
  string state = 4;
  string reason = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Recent persisted lifecycle events, without payloads or enrollment secrets.
message ListInventoryEventsRequest { int32 page_size = 1; string page_token = 2; }
message ListInventoryEventsResponse { repeated InventoryEvent events = 1; string next_page_token = 2; }
message InventoryEvent {
  string resource_id = 1;
  string kind = 2;
  string event_type = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message CordonInventoryHostRequest { string host_id = 1; string reason = 2; }
message CordonInventoryHostResponse { InventoryHost host = 1; }
message UncordonInventoryHostRequest { string host_id = 1; }
message UncordonInventoryHostResponse { InventoryHost host = 1; }
message DrainInventoryHostRequest { string host_id = 1; }
message DrainInventoryHostResponse { InventoryHost host = 1; }

// A failed_precondition detail on SetMigrationPause that forbids migration,
// rather than merely declining best-effort traffic draining. Providers abort
// before queuing snapshot work for reason machine_update_in_progress.
message MigrationVeto {
  string reason = 1;
}

message AcquireMachineUpdateFenceRequest {
  // Immutable attempt UUID; repeats with different fields are refused.
  string idempotency_key = 1;
  string provider_machine_id = 2;
  // Stable instance management signing-key UUID, not a credential.
  string controller_id = 3;
  string attempt_id = 4;
  // Persisted monotonically increasing Core attempt sequence, never wall time.
  uint64 sequence = 5;
}
message AcquireMachineUpdateFenceResponse { bool allowed = 1; }
message ReleaseMachineUpdateFenceRequest {
  string idempotency_key = 1;
  string provider_machine_id = 2;
  string controller_id = 3;
  string attempt_id = 4;
  // Core has durably cancelled or safely completed this exact attempt.
  // Advance the closed watermark without clearing a different held attempt.
  uint64 sequence = 5;
}
message ReleaseMachineUpdateFenceResponse { uint64 closed_through_sequence = 1; }
