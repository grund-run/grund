syntax = "proto3";

package grund.machine.v1;

import "google/protobuf/timestamp.proto";

// The machines an organisation runs on: the customer's own hardware and
// grund machines alike. Every method acts as the caller, identified by the
// dashboard session. An organisation is named by its slug; one the caller is
// not a member of is not_found, exactly as if it did not exist, and so is a
// machine of another organisation.
service MachineService {
  // Owners and admins. Mints a one-time enrollment token for a new machine
  // of this organisation: it works once, for 10 minutes (at most 15), and is
  // returned only here. An organisation has at most 20 unused tokens at a
  // time (resource_exhausted beyond that).
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse);

  // The organisation's machines, enrolled first first. Revoked machines are
  // listed with revoked_at set.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Owners and admins. Ends the machine's identity: its key is refused from
  // now on. Revoking a revoked machine changes nothing.
  rpc RevokeMachine(RevokeMachineRequest) returns (RevokeMachineResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message CreateEnrollmentTokenRequest {
  string slug = 1;
  // Binds the machine's name; the machine cannot choose another. Empty lets
  // the machine suggest one (from its hostname). A DNS label: 1 to 63 of
  // a-z, 0-9 and inner hyphens.
  string machine_name = 2;
  // How long the token works. 0 means 600 (10 minutes); at most 900.
  int32 ttl_seconds = 3;
}

message CreateEnrollmentTokenResponse {
  // grund_enr_ followed by 52 base32 characters. Shown once; grund keeps
  // only its SHA-256.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListMachinesRequest {
  string slug = 1;
}

message ListMachinesResponse {
  repeated Machine machines = 1;
}

message RevokeMachineRequest {
  string slug = 1;
  string machine_id = 2;
}

message RevokeMachineResponse {}

message Machine {
  string machine_id = 1;
  string name = 2;
  // Who minted the token it enrolled with: "user:<account id>" for hardware
  // a member added, "fleet-assignment:<assignment id>" for a grund machine.
  string minted_by = 3;
  google.protobuf.Timestamp enrolled_at = 4;
  // Set once the machine is revoked.
  google.protobuf.Timestamp revoked_at = 5;
  // What the machine said about itself at enrollment: for display only,
  // never used to decide anything.
  MachineFacts facts = 6;
  // The machine's Ed25519 public key, base64url without padding.
  string public_key = 7;
}

message MachineFacts {
  string hostname = 1;
  string arch = 2;
  string cpu_model = 3;
  int32 cpus = 4;
  int64 memory_mib = 5;
  int64 disk_gib = 6;
  string os = 7;
  string kernel = 8;
  string agent_version = 9;
  string fleet_machine_id = 10;
}
