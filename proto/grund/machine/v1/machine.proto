syntax = "proto3";

package grund.machine.v1;

import "google/protobuf/timestamp.proto";
import "grund/agent/v1/agent.proto";
import "grund/agent/v1/enrollment.proto";


// An organisation's machines: its own, and the ones leased to it. Members list
// and get; owners and admins mint join tokens and revoke own machines. An
// organisation the caller is not a member of, and a machine not in its pool,
// are not_found.
service MachineService {
  // A one-time grund_join_ token for one machine the organisation brings.
  // Shown once. ttl_seconds 0 means 600; at most 900.
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);

  // By name.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Own machines only; a leased machine is failed_precondition.
  rpc RevokeMachine(RevokeMachineRequest) returns (RevokeMachineResponse);

  // Sets the ports the machine accepts from the other members of the
  // organisation's private network, replacing those set before. Everything
  // else is closed. For a machine in the organisation's pool, its own or
  // leased to it; the same set again changes nothing. A lease that ends
  // closes them all.
  rpc DeclareMachinePorts(DeclareMachinePortsRequest) returns (DeclareMachinePortsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Owners and admins. Sets the machine's labels, replacing those set
  // before (apps.md §5.6): apps select machines by them and spread copies
  // over a key's values. Copies on a machine that no longer matches their
  // app move off. A lease that ends clears them.
  rpc SetMachineLabels(SetMachineLabelsRequest) returns (SetMachineLabelsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Owners and admins. Takes the machine out of service (in_service false)
  // or puts it back (apps.md §5.7). Out of service, nothing new is placed
  // on it and the copies on it move to other machines, each started and
  // ready before the old one stops; a copy no other machine has room for
  // stays. Revoke it once none are left.
  rpc SetMachineInService(SetMachineInServiceRequest) returns (SetMachineInServiceResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // The key the organisation's machines trust for its desired-state
  // documents. Made on first use.
  rpc GetOrganisationKey(GetOrganisationKeyRequest) returns (GetOrganisationKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Owners and admins. Runs a VM on one of the organisation's machines; the
  // grund inside it registers into the organisation as a machine of its own,
  // named `name`. The host must have reported a usable /dev/kvm and egress
  // (failed_precondition otherwise). The image is pinned by SHA-256.
  rpc RunVm(RunVmRequest) returns (RunVmResponse);

  // Owners and admins. Asks the VM to stop; its host frees what it held.
  rpc StopVm(StopVmRequest) returns (StopVmResponse);

  // The organisation's VMs, newest first, with what their hosts report.
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Owners and admins. Replaces this VM with the approved image after a safe
  // drain. A scoped idempotency key replays the same request; changed input
  // with that key is already_exists. A stale update version is failed_precondition.
  rpc UpdateVm(UpdateVmRequest) returns (UpdateVmResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc GetVmUpdate(GetVmUpdateRequest) returns (GetVmUpdateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Owners and admins. Requests safe cancellation of the named attempt.
  // Cancellation cannot undo an irreversible commit.
  rpc CancelVmUpdate(CancelVmUpdateRequest) returns (CancelVmUpdateResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message Machine {
  string machine_id = 1;
  // In an organisation view, its name in that organisation's pool; in a
  // capacity provider's view, its name in the provider pool.
  string name = 2;
  MachineState state = 3;
  grund.agent.v1.Pool pool = 4;
  // The organisation whose pool it is in now, if any.
  string organisation = 5;
  // Set while leased.
  Lease lease = 6;
  // 32 bytes; empty once revoked.
  bytes public_key = 7;
  grund.agent.v1.MachineFacts facts = 8;
  google.protobuf.Timestamp registered_at = 9;
  // When its current key was registered.
  google.protobuf.Timestamp key_registered_at = 10;
  // Who minted the token it registered with.
  string minted_by = 11;
  // The capacity provider's id for it, when grund asked a provider for it.
  // Management view only.
  string provider_machine_id = 12;
  // Whether its agent sent a heartbeat in the last 30 seconds.
  bool connected = 13;
  google.protobuf.Timestamp last_seen_at = 14;
  // What its agent last reported it can do.
  grund.agent.v1.Capabilities capabilities = 15;
  // What it accepts from its private network's other members, sorted.
  // Nothing else gets in.
  repeated NetworkPort network_ports = 16;
  // What its owner labelled it.
  map<string, string> labels = 17;
  // Set while it is out of service: since when.
  google.protobuf.Timestamp out_of_service_since = 18;
  // Existing wire field: true for a leased or extension-provisioned machine,
  // including one still joining. The field name is retained for clients.
  bool hosted = 19;
  // Reservations for this organisation only, not measured host usage.
  MachineActivity activity = 20;
  // The version from the latest heartbeat, not the registration facts.
  string agent_version = 21;
  // True only when the reported build is known to precede the expected build.
  // Different git revisions alone do not establish that ordering.
  bool agent_outdated = 22;
  // The server's build revision, when known; not a promise it is newer.
  string expected_agent_revision = 23;
}

// Allocations still held on a machine, including draining instances and
// desired-running VMs. Counts include desired-running app instances only.
message MachineActivity {
  int64 apps = 1;
  int64 instances = 2;
  int64 cpu_millis = 3;
  int64 memory_mib = 4;
  // The known sized-volume and VM reservation, not a measured disk total.
  int64 disk_gib = 5;
  // Unsized managed volumes or host paths make disk_gib an incomplete total.
  bool disk_unbounded = 6;
}

// A placed app instance or nondeleted volume, scoped to the current pool's
// organisation. Desired and observed states are deliberately separate.
message MachineWorkload {
  string app_id = 1;
  string app_name = 2;
  string id = 3;
  string name = 4;
  // "instance" or "volume".
  string kind = 5;
  // Instance: "running" or "draining". Volume: "present" or "deleted";
  // deletion requests can still hold disk until their allocation is removed.
  string desired = 6;
  // Instance: the last machine report, empty if none. Volume: its lifecycle
  // projection status, not an independently measured host state.
  string observed = 7;
  int64 cpu_millis = 8;
  int64 memory_mib = 9;
  // Absent for instances and unsized or host-path volumes.
  optional int64 disk_gib = 10;
  // The last reported volume size; absent when not measured.
  optional int64 measured_bytes = 11;
}

// Disconnect handling uses the same app settings and volume ownership as scheduling.
message MachineRecoveryPolicy {
  string app_id = 1;
  bool has_volumes = 2;
  uint32 reschedule_after_seconds = 3;
  // Unset while connected or pinned. Earliest eligibility, not a capacity guarantee;
  // server/database recovery can restart this clock.
  google.protobuf.Timestamp replacement_eligible_at = 4;
}

// A copy removed during this machine's current silence. An unset placed_at means
// its replacement has not been placed; placement does not establish readiness.
message MachineReplacement {
  string app_id = 1;
  string app_name = 2;
  string instance_id = 3;
  uint32 slot = 4;
  google.protobuf.Timestamp lost_at = 5;
  google.protobuf.Timestamp placed_at = 6;
  string machine_name = 7;
  uint32 reschedule_after_seconds = 8;
}

// The transport of a declared port.
enum NetworkTransport {
  NETWORK_TRANSPORT_UNSPECIFIED = 0;
  NETWORK_TRANSPORT_TCP = 1;
  NETWORK_TRANSPORT_UDP = 2;
}

// A port a machine accepts connections on from its network's other members.
message NetworkPort {
  NetworkTransport transport = 1;
  // 1 to 65535.
  uint32 port = 2;
}

// A VM an organisation runs on one of its machines.
message Vm {
  string vm_id = 1;
  string name = 2;
  // The machine it runs on, and that machine's name.
  string host_machine_id = 3;
  string host_name = 4;
  uint32 vcpus = 5;
  uint32 memory_mib = 6;
  uint32 disk_gib = 7;
  grund.agent.v1.VmImage image = 8;
  grund.agent.v1.VmDesiredState state = 9;
  // What its host last reported, and why, for a failure.
  grund.agent.v1.VmObservedState observed_state = 10;
  string observed_reason = 11;
  // The machine it registered as, once it did.
  string machine_id = 12;
  google.protobuf.Timestamp created_at = 13;
}


message Lease {
  string lease_id = 1;
  // The lessee's slug.
  string organisation = 2;
  // Its name in the lessee's pool.
  string name = 3;
  google.protobuf.Timestamp leased_at = 4;
}

enum MachineState {
  MACHINE_STATE_UNSPECIFIED = 0;
  MACHINE_STATE_AVAILABLE = 1;
  MACHINE_STATE_LEASED = 2;
  MACHINE_STATE_RETURNING = 3;
  MACHINE_STATE_ACTIVE = 4;
  MACHINE_STATE_REVOKED = 5;
  MACHINE_STATE_JOINING = 6;
  MACHINE_STATE_FAILED = 7;
  // A hosted request has reserved its allowance and is waiting for capacity.
  MACHINE_STATE_WAITING_CAPACITY = 8;
  // An older request has an uncertain provider outcome and needs operator reconciliation.
  MACHINE_STATE_RECOVERY_REQUIRED = 9;
}

message CreateJoinTokenRequest {
  string organisation = 1;
  string name = 2;
  int32 ttl_seconds = 3;
}

message CreateJoinTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  // The command to run on the machine, as root, that installs grund and
  // joins it with this token, as the dashboard's Add machine shows it.
  // Empty when the instance names no installer (GRUND_AGENT_INSTALL_URL,
  // GRUND_SERVE_INSTALLER).
  string install_command = 3;
}

message ListMachinesRequest {
  string organisation = 1;
}

message ListMachinesResponse {
  repeated Machine machines = 1;
}

message GetMachineRequest {
  string organisation = 1;
  string machine_id = 2;
}

message GetMachineResponse {
  Machine machine = 1;
  repeated MachineWorkload workloads = 2;
  // Fresh direct socket addresses reported within five minutes; own machines only.
  repeated string direct_addresses = 3;
  // Virtual machines allocated here, including their desired and observed states.
  repeated Vm vms = 4;
  repeated MachineRecoveryPolicy recovery_policies = 5;
  repeated MachineReplacement replacements = 6;
}

message RevokeMachineRequest {
  string organisation = 1;
  string machine_id = 2;
}

message RevokeMachineResponse {
  Machine machine = 1;
}

message DeclareMachinePortsRequest {
  string organisation = 1;
  string machine_id = 2;
  // All the ports it accepts, at most 64; empty closes it.
  repeated NetworkPort ports = 3;
}

message DeclareMachinePortsResponse {
  Machine machine = 1;
}

message SetMachineLabelsRequest {
  string organisation = 1;
  string machine_id = 2;
  // All its labels, at most 16; empty clears them. A key is 1 to 63
  // lowercase letters, digits, '.', '-', '_' or '/', starting and ending
  // with a letter or digit; a value is at most 63 letters, digits, '.',
  // '-' or '_'.
  map<string, string> labels = 3;
}

message SetMachineLabelsResponse {
  Machine machine = 1;
}

message SetMachineInServiceRequest {
  string organisation = 1;
  string machine_id = 2;
  bool in_service = 3;
}

message SetMachineInServiceResponse {
  Machine machine = 1;
}

message GetOrganisationKeyRequest {
  string organisation = 1;
}

message GetOrganisationKeyResponse {
  grund.agent.v1.PublicKey key = 1;
}

message RunVmRequest {
  string organisation = 1;
  // The organisation's machine to run it on.
  string on_machine_id = 2;
  string name = 3;
  uint32 vcpus = 4;
  uint32 memory_mib = 5;
  uint32 disk_gib = 6;
  grund.agent.v1.VmImage image = 7;
}

message RunVmResponse {
  Vm vm = 1;
}

message StopVmRequest {
  string organisation = 1;
  string vm_id = 2;
}

message StopVmResponse {
  Vm vm = 1;
}

message ListVmsRequest {
  string organisation = 1;
}

message ListVmsResponse {
  repeated Vm vms = 1;
}

message UpdateVmRequest {
  string organisation = 1;
  string vm_id = 2;
  string idempotency_key = 3;
  int64 expected_version = 4;
  // Must match the currently approved immutable target, not an arbitrary image.
  string rootfs_sha256 = 5;
}

message UpdateVmResponse {
  VmUpdateStatus update = 1;
}

message GetVmUpdateRequest {
  string organisation = 1;
  string vm_id = 2;
}

message GetVmUpdateResponse {
  VmUpdateStatus update = 1;
}

message CancelVmUpdateRequest {
  string organisation = 1;
  string vm_id = 2;
  string attempt_id = 3;
  string idempotency_key = 4;
}

message CancelVmUpdateResponse {
  VmUpdateStatus update = 1;
}

message VmUpdateStatus {
  string attempt_id = 1;
  string vm_id = 2;
  // Stable phase code, including preparing, draining, verifying and releasing.
  string phase = 3;
  bool paused = 4;
  string reason = 5;
  string available_rootfs_sha256 = 6;
  string current_rootfs_sha256 = 7;
  int64 update_version = 8;
  // Cleared only by current registered boot evidence, never by image pins alone.
  bool legacy_guest = 9;
  bool eligible = 10;
  bool can_cancel = 11;
}
