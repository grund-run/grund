syntax = "proto3";

package grund.domain.v1;

import "google/protobuf/timestamp.proto";

// An organisation's custom domains (grund-docs website/design/app-domains.md
// §3, design/traffic.md §3.2, §5.3): a name the organisation owns, proved
// with a TXT record grund generates, then bound to one of its apps, which
// grund's edges serve on it with a certificate grund orders.
//
// To serve app.example.com:
//   1. AddDomain; the answer names the TXT record to make
//      (_grund.app.example.com, holding the token).
//   2. Make that record and a CNAME from app.example.com to the app's
//      address (<app>-<organisation>.<app domain>).
//   3. VerifyDomain: grund looks the record up now.
//   4. BindDomain to the app. The certificate follows within minutes,
//      validated by HTTP-01 through the edge.
//
// One organisation holds a name at a time, from verification until it
// removes it. A name that was verified and then removed is held for a
// cool-down (7 days by default) before another organisation can add it.
//
// Members get and list; owners and admins add, verify, check, bind, unbind
// and remove. A deploy token may get and list, but an app-limited deploy token
// sees only domains bound to its allowed apps; unbound domains stay hidden.
// Only a person's session or full token may write domains. An organisation
// the caller cannot reach, and a domain it cannot reach, are not_found alike.
//
// Errors carry a stable reason in an ErrorReason detail: name_invalid,
// name_reserved (the instance's own names), domain_exists, domain_taken
// (another organisation holds it), domain_cooling_down, domain_limit,
// domain_rate_limited, not_verified, verification_failed (the message says
// what DNS answered), app_not_found, app_not_public (no public HTTP port),
// app_domain_limit, namespace_conflict (overlapping authority, live children,
// or an attempt to move a generated hostname), app_domain_required,
// subdomain_invalid.
service DomainService {
  // By name.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetDomain(GetDomainRequest) returns (GetDomainResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Owners and admins. At most 50 per organisation, and 20 added a day.
  rpc AddDomain(AddDomainRequest) returns (AddDomainResponse);

  // Owners and admins. Looks for the TXT record now. A verified domain
  // answers as it is.
  rpc VerifyDomain(VerifyDomainRequest) returns (VerifyDomainResponse);

  // Owners and admins. Queues the same durable setup check used by automatic
  // retries, without waiting for it to finish. Repeated calls coalesce.
  rpc CheckDomain(CheckDomainRequest) returns (CheckDomainResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Owners and admins. Binds a verified domain to an app with a public
  // HTTP port (the port its address serves); binding it to another app
  // moves it. At most 10 per app.
  rpc BindDomain(BindDomainRequest) returns (BindDomainResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Owners and admins. The domain stays verified; its certificate goes.
  rpc UnbindDomain(UnbindDomainRequest) returns (UnbindDomainResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Owners and admins. Unbinds it first. The certificate is not revoked.
  rpc RemoveDomain(RemoveDomainRequest) returns (RemoveDomainResponse);

  // Owners and admins, using a session or full token. Enables a verified
  // parent for app addresses and assigns defaults to existing apps atomically.
  // The parent's apex binding is independent. Repeated calls coalesce.
  rpc ConfigureAppDomain(ConfigureAppDomainRequest) returns (ConfigureAppDomainResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Owners and admins, using a session or full token. Atomically replaces
  // the app's generated hostname; the previous name is no longer served.
  rpc SetAppSubdomain(SetAppSubdomainRequest) returns (SetAppSubdomainResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

enum DomainStatus {
  DOMAIN_STATUS_UNSPECIFIED = 0;
  // Added; its TXT record has not been found yet.
  DOMAIN_STATUS_PENDING = 1;
  // Proved, bound to no app.
  DOMAIN_STATUS_VERIFIED = 2;
  // Bound; its certificate is on its way (or the instance orders none).
  DOMAIN_STATUS_BOUND = 3;
  // A certificate was issued; setup_steps records whether HTTPS is observed.
  DOMAIN_STATUS_CERTIFICATE_ISSUED = 4;
  // The last verification check or certificate order failed: problem says
  // why.
  DOMAIN_STATUS_ERROR = 5;
}

// A setup observation, not an inferred certificate or domain status.
enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_WAITING = 1;
  STEP_STATE_IN_PROGRESS = 2;
  STEP_STATE_DONE = 3;
  STEP_STATE_FAILED = 4;
}

message DomainSetupStep {
  // One of dns_record, edge_reachable, certificate_requested,
  // challenge_passed, certificate_issued, serving_https, in that order.
  string name = 1;
  StepState state = 2;
  // Factual result or reason; never a challenge token or private key.
  string detail = 3;
  // Absent until this step has been checked.
  google.protobuf.Timestamp checked_at = 4;
  // Absent when no retry is scheduled for this step.
  google.protobuf.Timestamp next_retry_at = 5;
}

message Domain {
  // Lowercase, no trailing dot.
  string name = 1;
  DomainStatus status = 2;
  // The TXT record proving ownership. Both fields are empty for generated
  // app hostnames: parent_domain names their verified authority instead.
  string verification_record_name = 3;
  string verification_record_value = 4;
  // The app it is bound to; empty when none.
  string app = 5;
  google.protobuf.Timestamp added_at = 6;
  google.protobuf.Timestamp verified_at = 7;
  google.protobuf.Timestamp bound_at = 8;
  google.protobuf.Timestamp certificate_expires_at = 9;
  // In words, when status is DOMAIN_STATUS_ERROR.
  string problem = 10;
  // Six persisted setup observations, including waiting steps when unbound.
  repeated DomainSetupStep setup_steps = 11;
  // Consecutive failed certificate attempts, including renewals; resets on success.
  int32 certificate_attempts = 12;
  // Absent when no certificate attempt is scheduled.
  google.protobuf.Timestamp certificate_next_attempt_at = 13;
  // This verified parent supplies the organisation's default app addresses.
  bool is_app_domain = 14;
  // Present only for generated app hostnames; authority comes from this parent.
  optional string parent_domain = 15;
  // The app whose generated hostname this is, even after explicit unbinding.
  string managed_app_name = 16;
}

message ListDomainsRequest {
  string organisation = 1;
}

message ListDomainsResponse {
  repeated Domain domains = 1;
}

message GetDomainRequest {
  string organisation = 1;
  string name = 2;
}

message GetDomainResponse {
  Domain domain = 1;
}

message AddDomainRequest {
  string organisation = 1;
  // app.example.com; case and a trailing dot are ignored. Not a wildcard.
  string name = 2;
}

message AddDomainResponse {
  Domain domain = 1;
}

message VerifyDomainRequest {
  string organisation = 1;
  string name = 2;
}

message VerifyDomainResponse {
  Domain domain = 1;
}

message CheckDomainRequest {
  string organisation = 1;
  string name = 2;
}

message CheckDomainResponse {
  Domain domain = 1;
}

message BindDomainRequest {
  string organisation = 1;
  string name = 2;
  // The app's name.
  string app = 3;
}

message BindDomainResponse {
  Domain domain = 1;
}

message UnbindDomainRequest {
  string organisation = 1;
  string name = 2;
}

message UnbindDomainResponse {
  Domain domain = 1;
}

message RemoveDomainRequest {
  string organisation = 1;
  string name = 2;
}

message RemoveDomainResponse {}

message ConfigureAppDomainRequest {
  string organisation = 1;
  // An existing, verified domain owned by this organisation. Not a wildcard.
  string name = 2;
}

message ConfigureAppDomainResponse {
  Domain domain = 1;
}

message SetAppSubdomainRequest {
  string organisation = 1;
  string app = 2;
  // One lowercase DNS label; empty uses the app's current name.
  string subdomain = 3;
}

message SetAppSubdomainResponse {
  Domain domain = 1;
}

// Attached as a detail to errors.
message ErrorReason {
  string reason = 1;
}
