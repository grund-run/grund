syntax = "proto3";

package grund.agent.v1;

import "grund/machine/v1/machine.proto";

// Called by a machine joining grund, once. Nothing at the transport
// authenticates it: the one-time token in the request is the credential, and
// the machine proves it holds the key it is enrolling by signing the request.
// Customer hardware and grund machines call it the same way; only who minted
// the token differs. The contract is grund/fleet's
// docs/design/enrollment-contract.md.
//
// Errors carry a grund.agent.v1.ErrorReason detail:
//   permission_denied  token_invalid   unknown, expired, used by another key,
//                                      malformed, or its organisation is gone:
//                                      deliberately one answer for all
//   invalid_argument   proof_invalid   a bad signature, a key that is not 32
//                                      bytes, or signed_at outside ±300 s
//   resource_exhausted rate_limited    too many calls from this address, or
//                                      for this token
//   unavailable        (none)          retry with backoff
service MachineEnrollmentService {
  // Exchanges a one-time enrollment token and a fresh machine key for a
  // machine identity. Calling it again with the same token and key, while
  // the token would still be valid, returns the same machine.
  rpc EnrollMachine(EnrollMachineRequest) returns (EnrollMachineResponse);
}

message EnrollMachineRequest {
  // grund_enr_…
  string token = 1;
  // Ed25519, 32 bytes, generated on the machine for this enrollment.
  bytes machine_public_key = 2;
  // Unix seconds; accepted within ±300 s of grund's clock.
  int64 signed_at_unix = 3;
  // Ed25519 by the machine key over
  //   "grund-enroll-v1\n" || origin || "\n" || signed_at_unix (decimal) || "\n" || sha256(token)
  // where origin is grund's public origin (scheme://host[:port], as
  // GRUND_PUBLIC_URL without a path) and sha256(token) is the 32 raw bytes.
  bytes signature = 4;
  // Recorded for display, never used to authorize anything.
  grund.machine.v1.MachineFacts facts = 5;
  // Ignored when the token binds a name. Otherwise the machine's name; empty
  // falls back to one made from facts.hostname.
  string requested_name = 6;
}

message EnrollMachineResponse {
  string machine_id = 1;
  string machine_name = 2;
  string organisation_id = 3;
  // Where the machine's agent connects, in order of preference.
  repeated string control_urls = 4;
  int32 heartbeat_interval_seconds = 5;
}

// The stable reason of an error, as a detail.
message ErrorReason {
  string reason = 1;
}
