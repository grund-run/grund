// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

package grund.agent.v1;

import "google/protobuf/timestamp.proto";
import "grund/agent/v1/enrollment.proto";

// The control link: how a registered machine's agent talks to its instance
// (grund-docs design/machines.md §7b). Until it moves onto iroh, it is HTTPS,
// and every request is signed by the machine key: the headers
// x-grund-machine (the machine id), x-grund-signed-at (Unix seconds, within
// 300 s of the instance) and x-grund-signature (base64 of Ed25519 over
// "grund-agent-request-v1\n" || path || "\n" || signed_at || "\n" ||
// lowercase hex SHA-256 of the body). A missing, stale or wrong signature,
// an unknown machine and a revoked one are all unauthenticated, alike.
service AgentService {
  // Says the machine is alive and what it can do, and learns the generation
  // of its desired state, so it fetches a new document only when there is
  // one. Capabilities are facts for placement, never authorization.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // The machine's desired state, if newer than since_generation; empty
  // otherwise.
  rpc GetDesiredState(GetDesiredStateRequest) returns (GetDesiredStateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The machine's desired state once its generation is newer than
  // since_generation: at once if it already is, otherwise as soon as a
  // decision touching the machine commits, or after at most 10 s with the
  // document left unset (apps.md §6.1).
  rpc WatchDesiredState(WatchDesiredStateRequest) returns (WatchDesiredStateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The secret values one replica needs, for a replica placed on the
  // calling machine and still in its document; anything else is not_found,
  // whether the replica exists or not. Values never travel in a document
  // (apps.md §6.5).
  rpc GetReplicaSecrets(GetReplicaSecretsRequest) returns (GetReplicaSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The organisation's login to the registry a replica's image is pulled
  // from, for a replica placed on the calling machine and still in its
  // document; anything else is not_found, whether the replica exists or
  // not. Unset credential: the organisation has none for that host, so the
  // pull is anonymous. Asked before each pull, never kept in a document
  // (apps.md §6.5).
  rpc GetPullCredential(GetPullCredentialRequest) returns (GetPullCredentialResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The one-time grund_join_ token a VM this machine was told to run boots
  // with. Only for a running VM placed on the calling machine that has not
  // registered yet; anything else is not_found. A token is a secret, so it
  // never travels in a document (apps.md §6.5).
  rpc GetMachineJoinToken(GetMachineJoinTokenRequest) returns (GetMachineJoinTokenResponse);

  // What actually runs, level-triggered: the whole picture every time.
  rpc ReportStatus(ReportStatusRequest) returns (ReportStatusResponse);

  // Lease one pending backup/restore/probe/prune attempt for this signed
  // machine only. Never place repository credentials in desired state.
  rpc GetBackupWork(GetBackupWorkRequest) returns (GetBackupWorkResponse);

  // CAS-ack an attempt using its id and placement generation; stale agents
  // cannot mark a new machine's work complete.
  rpc ReportBackupResult(ReportBackupResultRequest) returns (ReportBackupResultResponse);

  // The newest signed membership list of a private network the machine is a
  // member of, once its epoch is newer than since_epoch: at once if it
  // already is, otherwise when membership changes, or after at most 10 s
  // with the list left empty. A network the machine is not a member of is
  // not_found, whether it exists or not.
  rpc GetMembership(GetMembershipRequest) returns (GetMembershipResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The lease a machine of the management pool is on: the grant the
  // management key signs (the key the machine pinned at registration),
  // naming the organisation whose documents it may accept from now on and
  // that organisation's private network. Unset when the machine is on no
  // lease: available, returning, or of an organisation's own pool. A
  // machine that held a grant and is answered none, or another lease, drops
  // everything of the old lessee's (grund-docs design/machines.md §5.3).
  rpc GetLease(GetLeaseRequest) returns (GetLeaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetBackupWorkRequest {
  // Must match the authenticated machine identity.
  string machine_id = 1;
}

message GetBackupWorkResponse {
  // Absent when there is no eligible work on this machine.
  BackupWork work = 1;
}

message BackupWork {
  string attempt_id = 1;
  string volume_id = 2;
  string app_id = 3;
  uint64 placement_generation = 4;
  BackupOperation operation = 5;
  string source_volume_id = 6;
  string destination_volume_id = 7;
  // Exact recovery point to create, restore, probe or prune.
  string snapshot_id = 8;
  // Sent over the authenticated control link only, never a signed document.
  string endpoint = 9;
  string bucket = 10;
  string repo_prefix = 11;
  string access_key_id = 12;
  string secret_access_key = 13;
  string session_token = 14;
  string repository_password = 15;
  // Must match the organisation of the machine's pinned signed document.
  string organisation_id = 16;
  // For BACKUP of an existing host-path bind, the recorded source: the
  // agent MUST match it to its signed mount and local policy before reading.
  // For RESTORE or PROBE, the completed point's archived absolute path is
  // only a selector inside the encrypted snapshot, never host-file access.
  // Empty for a managed BACKUP: the agent resolves its own data directory.
  string source_path = 17;
}

enum BackupOperation {
  BACKUP_OPERATION_UNSPECIFIED = 0;
  BACKUP_OPERATION_BACKUP = 1;
  BACKUP_OPERATION_RESTORE = 2;
  BACKUP_OPERATION_PROBE = 3;
  BACKUP_OPERATION_PRUNE = 4;
}

message ReportBackupResultRequest {
  string machine_id = 1;
  string attempt_id = 2;
  uint64 placement_generation = 3;
  // Only a completed and verified operation reports success. An attempted
  // upload is not a recovery point; failures carry a safe class, no secrets.
  bool success = 4;
  string snapshot_id = 5;
  string failure_class = 6;
  // Only on a successful BACKUP: the actual absolute source archived by the
  // agent (including its managed data directory), so another machine can
  // select the correct path in the completed snapshot. Never an attachment
  // authorisation or a host path for future restore.
  string source_path = 7;
}

message ReportBackupResultResponse {
  // False for a stale or superseded attempt; no recovery point was published
  // by this report.
  bool accepted = 1;
}

message GetLeaseRequest {}

message GetLeaseResponse {
  SignedLeaseGrant grant = 1;
}

message GetMembershipRequest {
  // The network; empty for the network of the machine's pool.
  string network_id = 1;
  uint64 since_epoch = 2;
  // The relay this machine is homed on now, one of those its list names;
  // empty when it has none. grund puts it in the list, so members dial the
  // machine through that one relay rather than all of them.
  string home_relay_url = 3;
  // Where this machine is reached directly, as IP:port: its bound uplink
  // addresses and those address discovery found. grund puts the fresh ones
  // in the list, so a member reaches it without a relay.
  repeated string direct_addrs = 4;
}

message GetMembershipResponse {
  string network_id = 1;
  // The network's current epoch, whether or not a list is sent.
  uint64 epoch = 2;
  // Set when epoch is newer than since_epoch: grund_net's SignedList, the
  // list's bytes (serde_json of MembershipList) and Ed25519 over
  // "grund-net-membership-v1\n" || body, by the key the machine pinned.
  SignedMembershipList list = 3;
}

message SignedMembershipList {
  // The key that signed it; the machine refuses one it did not pin.
  string key_id = 1;
  bytes body = 2;
  bytes signature = 3;
}

message HeartbeatRequest {
  string agent_version = 1;
  Capabilities capabilities = 2;
  // Process boot identity and public build used for independently observed
  // update health. Older agents leave these empty and cannot finalize updates.
  string boot_id = 3;
  string public_revision = 4;
  // True only after this boot has initialized its machine runtime.
  bool update_ready = 5;
  // A signed assertion from this guest's current OS boot. Absence is unproven,
  // not evidence that an older guest can enforce workload limits.
  GuestBootEvidence guest_boot_evidence = 6;
}

message Capabilities {
  // A usable /dev/kvm.
  bool kvm = 1;
  // The VM runtime runs with root rather than in user namespaces.
  bool root = 2;
  // A guest can reach the internet, and so grund, to register.
  bool egress = 3;
  uint32 free_vcpus = 4;
  uint32 free_memory_mib = 5;
  // The machine runs containers (apps.md §5.2's apps capability): it is
  // root, has cgroup v2 and overlayfs, and grund's container runtime can
  // run here.
  bool apps = 6;
  // x86_64 or aarch64.
  string arch = 7;
  // Memory and CPU available to workloads when resources_allocatable is true;
  // otherwise legacy totals before the agent/runtime reserve.
  uint64 memory_mib = 8;
  uint32 cpu_millis = 9;
  // Why apps is false, for the user.
  string apps_unavailable_reason = 10;
  // The owner's limits on what one replica may ask for (apps.md §6.4); 0:
  // no limit beyond the machine.
  uint64 max_replica_memory_mib = 11;
  uint32 max_replica_cpu_millis = 12;
  // The size of the filesystem the agent keeps its data on, in GiB; 0:
  // not reported (agents before it, or unreadable).
  uint64 disk_gib = 13;
  // This agent can verify app-owned volume identities and writable mounts.
  // Absent on older agents: the scheduler must not place stateful apps there.
  bool volumes = 14;
  // Optional measured host usage, separate from placement reservations.
  // Older agents do not report this snapshot.
  MachineUsage usage = 15;
  // Updated agents subtract the system reserve before advertising capacity.
  // False keeps legacy total-capacity reports safe during a rolling update.
  bool resources_allocatable = 16;
  // Supports stack-exclusive replacement and operation-fenced stop receipts.
  bool stack_services = 17;
  // 0 means unsupported. Version 1 stages and physically fences guest roots;
  // an older host must never receive replacement work.
  uint32 vm_replacement_version = 18;
}

// Active kernel configuration and owned-process attachment, not a benchmark.
// All flags must be true and failure_code empty for a positive proof.
message ResourceLimitProof {
  bool cpu_verified = 1;
  bool memory_verified = 2;
  bool attachment_verified = 3;
  // Bounded machine code; never a host path, command output or secret.
  string failure_code = 4;
}

// PID 1 binds the launch context to the actual OS boot before starting the
// agent. An agent process restart cannot manufacture a new guest launch.
message GuestBootEvidence {
  uint32 version = 1;
  string vm_id = 2;
  string attempt_id = 3;
  // The operation that launched this boot, not a later finalize operation.
  uint64 sequence = 4;
  string launch_nonce = 5;
  // Linux's kernel boot UUID, distinct from HeartbeatRequest.boot_id.
  string os_boot_id = 6;
  ResourceLimitProof resources = 7;
}

// One bounded host sample. Missing numeric fields mean unknown, not zero.
message MachineUsage {
  // Actual CPU across all cores in millicores, averaged since the previous
  // heartbeat sample. Idle and iowait are excluded; guest time is counted once.
  // Absent on the first sample or when counters cannot be compared.
  optional uint32 cpu_millis = 1;
  // MemTotal minus MemAvailable, not the sum of process resident memory.
  optional uint64 memory_used_bytes = 2;
  // Total minus free blocks on the filesystem holding the agent's data,
  // including blocks reserved from unprivileged users.
  optional uint64 disk_used_bytes = 3;
  optional uint64 disk_total_bytes = 4;
  optional uint64 uptime_seconds = 5;
  google.protobuf.Timestamp sampled_at = 6;
  // Embedded build revision, or "unknown" for builds without revision metadata.
  string agent_revision = 7;
}

message HeartbeatResponse {
  // The newest generation of this machine's desired state; 0 for none yet.
  uint64 generation = 1;
  int32 heartbeat_interval_seconds = 2;
}

message GetDesiredStateRequest {
  uint64 since_generation = 1;
}

message GetDesiredStateResponse {
  // Unset when the instance has nothing newer than since_generation.
  SignedDesiredState document = 1;
}

message WatchDesiredStateRequest {
  uint64 since_generation = 1;
}

message WatchDesiredStateResponse {
  // Unset when nothing newer than since_generation committed while the call
  // waited.
  SignedDesiredState document = 1;
}

message GetReplicaSecretsRequest {
  string replica_id = 1;
}

message GetReplicaSecretsResponse {
  // Exactly the names and versions the replica's entry lists.
  repeated SecretValue secrets = 1;
}

message GetPullCredentialRequest {
  string replica_id = 1;
}

message GetPullCredentialResponse {
  RegistryCredential credential = 1;
}

// A login to one registry host, as image references name it (docker.io,
// ghcr.io, registry.example.com:5000).
message RegistryCredential {
  string host = 1;
  string username = 2;
  // The password or access token.
  string password = 3;
}

message SecretValue {
  string name = 1;
  uint32 version = 2;
  bytes value = 3;
}

// signature = Ed25519(organisation key, "grund-desired-state-v1\n" ||
// payload), where payload is an encoded DesiredState. The agent verifies the
// bytes it received against the key it pinned, then decodes them.
message SignedDesiredState {
  // The organisation key's id.
  string key_id = 1;
  bytes payload = 2;
  bytes signature = 3;
}

// Everything one machine should run, every time, never a diff (apps.md §6.2).
// One generation and one signature cover replicas and machines together.
message DesiredState {
  string machine_id = 1;
  string organisation_id = 2;
  // +1 for every document for this machine, never reused. The agent refuses
  // an older one.
  uint64 generation = 3;
  int64 issued_at_unix = 4;
  // Features the agent must know to apply this document; it refuses the whole
  // document otherwise, rather than silently ignore a part. "machines" when
  // machines is not empty; "volumes" when any replica mounts a volume or
  // volume_deletions is nonempty.
  repeated string required_features = 5;
  // Containers (apps.md §6.2). "replicas" is in required_features when this
  // is not empty.
  repeated Replica replicas = 6;
  // VMs to run on this machine, each of which registers into the same
  // organisation (design/machines.md §7b).
  repeated Vm machines = 7;
  // Images to fetch ahead of a rollout, so a new replica does not wait on a
  // download (apps.md §8.2).
  repeated Image prefetch = 8;
  reserved 9;
  reserved "registries";
  // Keys the agent pins beside the current one, for a rotation (apps.md
  // §6.3). Not issued yet.
  repeated NextKey next_keys = 10;
  // The keys that may open grund/entry/1 streams to this machine's gate,
  // as iroh prints an endpoint id: the instance's enrolled edges
  // (grund-docs design/traffic.md §7.1). Empty: no entry stream is
  // accepted.
  repeated string entry_keys = 11;
  // Explicit app-owned grund-managed directories to erase. Omission of a
  // mount NEVER implies deletion. The signature covers these tombstones,
  // including their app owner; never erase an existing host-path source.
  repeated VolumeDeletion volume_deletions = 12;
}

message VolumeDeletion {
  string volume_id = 1;
  string app_id = 2;
}

message NextKey {
  string key_id = 1;
  // 32 bytes.
  bytes public_key = 2;
}

message Replica {
  string replica_id = 1;
  string app = 2;
  uint32 release = 3;
  uint32 slot = 4;
  uint64 placement = 5;
  Image image = 6;
  repeated string command = 7;
  repeated EnvVar env = 8;
  repeated Port ports = 9;
  uint64 memory_mib = 10;
  uint32 cpu_millis = 11;
  ReplicaState state = 12;
  // Names and versions only; values are fetched over the control link.
  repeated SecretRef secrets = 13;
  // For a public port: its grund.run name and verified custom domains. The
  // first is the app's address on the instance's app domain, which is HTTPS
  // only; the gate answers 421 to any host not listed (grund-docs
  // design/traffic.md §7.3).
  repeated string hostnames = 14;
  // Unset: ready once its process has run for min_ready.
  ReplicaCheck check = 15;
  ReplicaStop stop = 16;
  reserved 17;
  reserved "mounts";
  // Reserved for customer-signed releases (apps.md §6.6); empty in v1.
  bytes release_signature = 18;
  // Secrets handed to the app as environment variables: the variable, and
  // which of secrets it takes.
  repeated SecretEnv secret_env = 19;
  // The organisation's id for the app, so the agent can label and group
  // its replicas.
  string app_id = 20;
  // Resolve these IDs on this machine before starting a copy. A missing or
  // disallowed mount refuses the copy, never starts with an empty fallback.
  repeated VolumeMount volumes = 21;
  // A stack singleton: never start a successor before its predecessor stops.
  bool exclusive = 22;
  // Drain and stop without recreating, including a replica without volumes.
  bool stopping = 23;
  // Absent keeps the legacy 30-second drain; zero drains immediately.
  optional uint32 drain_seconds = 24;
  // Echoed in status with the applied document generation to fence receipts.
  string operation_id = 25;
  // Relative stack DNS suffix, such as "shop.grund.internal".
  string stack_search = 26;
  // Process overrides with Docker's rules, set only by a local source such
  // as grund up; grund-server never sets them. Absent keeps the image's
  // value. An empty Argv clears it. A replica that sets entrypoint or cmd
  // must leave command empty.
  optional Argv entrypoint = 27;
  optional Argv cmd = 28;
  // Absolute directory; absent keeps the image's working directory.
  optional string working_dir = 29;
  // "uid", "uid:gid", "name" or "name:group", resolved against the image's
  // /etc/passwd and /etc/group like the image's own User.
  optional string user = 30;
  // When an exited replica starts again, set only by a local source such
  // as grund up. Absent restarts it always, on the back-off, as for every
  // grund-server document.
  optional RestartPolicy restart = 31;
}

// Compose's restart policies. A replica the policy keeps exited is reported
// exited with its code until its document changes.
message RestartPolicy {
  RestartMode mode = 1;
  // For on-failure: the restarts after which it stays exited; 0 is no limit.
  uint32 max_retries = 2;
}

enum RestartMode {
  // Treated as always.
  RESTART_MODE_UNSPECIFIED = 0;
  RESTART_MODE_ALWAYS = 1;
  // Restart only after a nonzero exit code.
  RESTART_MODE_ON_FAILURE = 2;
  RESTART_MODE_NEVER = 3;
}

// An argument vector whose presence matters: absent and empty differ.
message Argv {
  repeated string args = 1;
}

message VolumeMount {
  string volume_id = 1;
  string name = 2;
  // Absolute directory in the container.
  string path = 3;
  // Existing host path, subject to machine-local policy. Empty uses the
  // grund-managed directory /var/lib/grund/volumes/<volume_id> unless
  // block_device is true.
  string source = 4;
  // App-owned block volume already attached to this machine. The agent
  // accepts only ext4 whose filesystem UUID equals volume_id and whose ID is
  // UUIDv5(app_id, UTF8 name). source must be empty; no directory is created
  // as a fallback.
  bool block_device = 5;
}

message SecretEnv {
  string env = 1;
  string secret = 2;
}

// Probed from the replica's machine, inside its network namespace: ready
// after one pass, not ready after three failures in a row or at once on an
// exit.
message ReplicaCheck {
  oneof kind {
    // GET; any 2xx or 3xx passes.
    string http_path = 1;
    bool tcp = 2;
  }
  uint32 port = 3;
  uint32 interval_ms = 4;
  uint32 timeout_ms = 5;
}

message ReplicaStop {
  // SIGTERM, SIGINT, SIGQUIT, SIGUSR1, SIGUSR2 or SIGHUP.
  string signal = 1;
  uint32 grace_seconds = 2;
}

message Image {
  // For display.
  string reference = 1;
  // sha256:<64 hex>: what runs.
  string digest = 2;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message Port {
  string name = 1;
  uint32 port = 2;
  // http, h2c or tcp.
  string protocol = 3;
  bool public = 4;
}

message SecretRef {
  string name = 1;
  uint32 version = 2;
}

enum ReplicaState {
  REPLICA_STATE_UNSPECIFIED = 0;
  REPLICA_STATE_RUNNING = 1;
  REPLICA_STATE_DRAINING = 2;
}

message Vm {
  // grund's id for the VM.
  string vm_id = 1;
  // The name it registers under.
  string name = 2;
  uint32 vcpus = 3;
  uint32 memory_mib = 4;
  uint32 disk_gib = 5;
  VmImage image = 6;
  VmDesiredState state = 7;
  // The ordinary state remains RUNNING during replacement. Older hosts ignore
  // this field, so they cannot mistake a quiesce for destructive ordinary stop.
  VmUpdate update = 8;
}

message VmImage {
  Artifact kernel = 1;
  Artifact rootfs = 2;
}

// A fenced operation in the instance's serial machine-update rollout.
message VmUpdate {
  uint32 version = 1;
  string attempt_id = 2;
  // Increases for each distinct operation within the attempt.
  uint64 sequence = 3;
  VmUpdateAction action = 4;
  VmImage image = 5;
  string guest_machine_id = 6;
  // The current registered public key; never the guest's private seed.
  bytes registration_key = 7;
  // Fresh for each physical launch, including rollback.
  string launch_nonce = 8;
  google.protobuf.Timestamp deadline = 9;
}

enum VmUpdateAction {
  VM_UPDATE_ACTION_UNSPECIFIED = 0;
  VM_UPDATE_ACTION_PREPARE = 1;
  VM_UPDATE_ACTION_QUIESCE = 2;
  VM_UPDATE_ACTION_START_CANDIDATE = 3;
  VM_UPDATE_ACTION_COMMIT = 4;
  VM_UPDATE_ACTION_ROLLBACK = 5;
  VM_UPDATE_ACTION_RELEASE_OLD = 6;
}

// A file pinned by digest.
message Artifact {
  string url = 1;
  // Lowercase hex SHA-256.
  string sha256 = 2;
}

enum VmDesiredState {
  VM_DESIRED_STATE_UNSPECIFIED = 0;
  VM_DESIRED_STATE_RUNNING = 1;
  VM_DESIRED_STATE_STOPPED = 2;
}

message GetMachineJoinTokenRequest {
  string vm_id = 1;
}

message GetMachineJoinTokenResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ReportStatusRequest {
  // The generation the agent applied last.
  uint64 applied_generation = 1;
  repeated VmObserved machines = 2;
  // Why the agent refused a document or a part of one, for the dashboard.
  repeated string refusals = 3;
  // Every replica of the applied document, and any other container the
  // agent still runs (one leaving, stopped within its grace).
  repeated ReplicaObserved replicas = 4;
  // Whether this agent reports replicas at all; an older one leaves
  // replicas empty and this false.
  bool reports_replicas = 5;
  // Successful physical deletion of grund-managed directories, repeated on
  // each pass until the server stops sending their signed tombstones.
  // A failure belongs in refusals, not here.
  repeated VolumeDeleted volume_deletions = 6;
}

message VolumeDeleted {
  string volume_id = 1;
  string app_id = 2;
}

message ReplicaObserved {
  string replica_id = 1;
  ReplicaObservedState state = 2;
  // Its check passes (or it has no check and has run for min_ready).
  bool ready = 3;
  // How long it has been ready without a break, as the agent measured it,
  // so no clock is compared across machines.
  uint64 ready_for_ms = 4;
  // Restarts after an exit since it was created.
  uint32 restarts = 5;
  int32 last_exit_code = 6;
  // For failed and refused, or the last failed check: why, for the user.
  string reason = 7;
  // A draining replica with no request or connection in flight through the
  // gate, so the instance may stop it before its drain ends (apps.md §12.3).
  bool idle = 8;
  // The exact desired document snapshot processed by the apps loop, not merely
  // the newest document received by the control loop. Zero means unconfirmed.
  uint64 applied_generation = 9;
  string operation_id = 10;
}

enum ReplicaObservedState {
  REPLICA_OBSERVED_STATE_UNSPECIFIED = 0;
  REPLICA_OBSERVED_STATE_PULLING = 1;
  REPLICA_OBSERVED_STATE_STARTING = 2;
  REPLICA_OBSERVED_STATE_RUNNING = 3;
  REPLICA_OBSERVED_STATE_EXITED = 4;
  REPLICA_OBSERVED_STATE_FAILED = 5;
  REPLICA_OBSERVED_STATE_REFUSED = 6;
  REPLICA_OBSERVED_STATE_STOPPING = 7;
}

message VmObserved {
  string vm_id = 1;
  VmObservedState state = 2;
  // For failed: why, for the user.
  string reason = 3;
  // For exited, when known.
  int32 exit_code = 4;
  // Valid only in the same current-generation ReportStatus transaction as
  // this VM observation; an earlier stopped report is not a quiesce ack.
  VmUpdateObserved update = 5;
}

// A host-kernel identity, not a PID file by itself.
message VmProcessIdentity {
  uint32 pid = 1;
  uint64 start_ticks = 2;
  string host_os_boot_id = 3;
}

// Image and process witnesses from the trusted host, bound to one operation.
// This does not replace the guest's separately signed boot/resource evidence.
message VmUpdateObserved {
  uint32 version = 1;
  string attempt_id = 2;
  uint64 sequence = 3;
  VmUpdatePhase phase = 4;
  string kernel_sha256 = 5;
  string rootfs_sha256 = 6;
  string launch_nonce = 7;
